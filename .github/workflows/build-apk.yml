name: Build GBA 60Hz APK

# 出包方式：
#   1) 手动：Actions 页 → 选本工作流 → Run workflow（可填版本号）
#   2) 自动：push 到 main 或打 v* 标签时触发
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本号 (可选，如 1.6.1)'
        required: false
        default: ''
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Build Tools 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Inject version name (if provided)
        if: ${{ github.event.inputs.version_name != '' }}
        shell: bash
        run: |
          V="${{ github.event.inputs.version_name }}"
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$V\"/" app/build.gradle.kts
          echo "versionName set to $V"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/GBA-60Hz-v${{ github.event.inputs.version_name || github.ref_name }}.apk"
          ls -lh out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GBA-60Hz-APK
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90
