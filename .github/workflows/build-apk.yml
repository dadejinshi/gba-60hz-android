name: Build GBA 60Hz APK

# 出包方式：
#   1) 手动：Actions 页 → 选本工作流 → Run workflow（可填版本号）
#   2) 自动：push 到 main 或打 v* 标签时触发
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本号 (可选，如 1.6.1)'
        required: false
        default: ''
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    # 固定 24.04：ubuntu-latest 正在迁往 26.04，Android 工具链在旧镜像上更稳
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不再用 android-actions/setup-android@v3（它已跟不上 runner 的
      # Node 24 / 新镜像，会在装 SDK 时直接失败）。改为用镜像自带 SDK，
      # 缺了再自己下 commandline-tools，行为可控。
      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "预装 SDK 不完整，下载 commandline-tools 到 $HOME/android-sdk"
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL --retry 3 -o /tmp/clt.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK"       >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK"   >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "使用 SDK: $SDK"

      - name: Install platform 35 / build-tools 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --list_installed | head -20

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Inject version name (if provided)
        if: ${{ github.event.inputs.version_name != '' }}
        shell: bash
        run: |
          V="${{ github.event.inputs.version_name }}"
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$V\"/" app/build.gradle.kts
          echo "versionName set to $V"

      - name: Build Debug APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          VER="${{ github.event.inputs.version_name }}"
          if [ -z "$VER" ]; then
            VER="$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "out/GBA-60Hz-v${VER}.apk"
          echo "APK_FILE=GBA-60Hz-v${VER}.apk" >> "$GITHUB_ENV"
          ls -lh out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GBA-60Hz-APK
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

      # 打 v* 标签时顺便发布 Release：APK 变成免登录的直链，手机点一下就能装
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" "out/${APK_FILE}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "GBA 60Hz ${GITHUB_REF_NAME}" \
            --notes "GitHub Actions 自动构建（debug 签名，仅供测试安装）。" \
            --verify-tag
