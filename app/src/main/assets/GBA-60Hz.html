<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#08090f">
<title>GBA 60Hz · 高清</title>
<style>
:root{
  /* ===== 界面主题变量（默认：星云紫）— body[data-uitheme] 覆盖，与按键皮肤完全独立 ===== */
  --bg:#08090f;--glow1:#241a52;--glow2:#0b2d2d;--panel:#151827;--line:#2e3450;
  --txt:#eef1fa;--dim:#98a0b8;--a:#7c5cff;--a2:#5638cf;--b:#3ddbc4;
  --card:#171b2b;--card2:#1e2337;--shadow:0 8px 30px #0006;
  /* 按键皮肤默认（克莱因蓝）— 由 data-keytheme 覆盖 */
  --kb:#ffffff1a;--kf:#e9edf9cc;--kon:#7c5cffcc;--kfc:#fff;--karw:#e9edf9b0;--kring:transparent;--kedge:#7c5cff55;--kglow:none}
/* ===== 8 套界面主题：只改整体观感，不碰按键皮肤（data-keytheme） ===== */
body[data-uitheme="nebula"] {--bg:#08090f;--glow1:#241a52;--glow2:#0b2d2d;--panel:#151827;--line:#2e3450;--txt:#eef1fa;--dim:#98a0b8;--a:#7c5cff;--a2:#5638cf;--b:#3ddbc4;--card:#171b2b;--card2:#1e2337}
body[data-uitheme="onyx"]   {--bg:#07080a;--glow1:#1c1f26;--glow2:#0d1115;--panel:#14161c;--line:#2a2e38;--txt:#f2f4f8;--dim:#9aa0ad;--a:#c8cdd8;--a2:#8b919d;--b:#7d8bff;--card:#171a21;--card2:#1e222b}
body[data-uitheme="ocean"]  {--bg:#050a14;--glow1:#0b2350;--glow2:#062b3c;--panel:#101b2d;--line:#24365a;--txt:#eaf2ff;--dim:#90a4c4;--a:#3d7bff;--a2:#2256cc;--b:#33d6e0;--card:#111e33;--card2:#172742}
body[data-uitheme="emerald"]{--bg:#050d0a;--glow1:#0c3a2a;--glow2:#0a2a2e;--panel:#101e19;--line:#1f4436;--txt:#eafaf2;--dim:#8fb8a6;--a:#2ecc8f;--a2:#1a9c66;--b:#a8e063;--card:#12221c;--card2:#182e26}
body[data-uitheme="rose"]   {--bg:#10080c;--glow1:#4a1c33;--glow2:#3a1c28;--panel:#1f1420;--line:#4a2a3c;--txt:#fff0f5;--dim:#c49aae;--a:#ff6b9d;--a2:#d63e76;--b:#ffc47a;--card:#231722;--card2:#2e1d2c}
body[data-uitheme="sunset"] {--bg:#0f0905;--glow1:#4a2608;--glow2:#3a1608;--panel:#1e1610;--line:#4a3220;--txt:#fff5e8;--dim:#c2a487;--a:#ff9838;--a2:#d96a12;--b:#ffcf6b;--card:#241a12;--card2:#2f2318}
body[data-uitheme="aurora"] {--bg:#040e10;--glow1:#06343c;--glow2:#0a2440;--panel:#0c1e24;--line:#1c414a;--txt:#e8fbfd;--dim:#88b4bd;--a:#22d3c5;--a2:#0fa496;--b:#7aa8ff;--card:#0e252c;--card2:#14323b}
body[data-uitheme="ivory"]  {--bg:#eef0f5;--glow1:#dfe4f5;--glow2:#e4f2f0;--panel:#ffffff;--line:#d4d9e6;--txt:#20263a;--dim:#6b7389;--a:#6a4de0;--a2:#5135bd;--b:#0f9c8a;--card:#f7f8fc;--card2:#ffffff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--txt);overflow:hidden;
  font:14px/1.5 system-ui,-apple-system,"PingFang SC","Noto Sans SC",sans-serif;overscroll-behavior:none;
  background:radial-gradient(120% 80% at 15% -10%,var(--glow1) 0%,transparent 55%),
             radial-gradient(100% 70% at 100% 0%,var(--glow2) 0%,transparent 45%),
             var(--bg)}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
header{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 14px 6px;flex:none}
.brand{font-weight:800;font-size:17px;letter-spacing:.02em;display:flex;align-items:center;gap:7px}
.brand::before{content:'';width:22px;height:22px;border-radius:7px;flex:none;
  background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 0 16px var(--a);
  -webkit-mask:radial-gradient(circle at 30% 30%,#000 34%,transparent 35%) ,linear-gradient(#000,#000);
  -webkit-mask-composite:source-out;mask-composite:subtract}
.tag{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--b);border:1px solid var(--line);
  background:var(--panel);padding:2px 7px;border-radius:20px}
.sp{flex:1}
.fps{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums;display:none}
button{font:inherit;color:var(--txt);background:linear-gradient(180deg,var(--card2),var(--card));
  border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:0 1px 0 #ffffff0a inset;
  transition:transform .06s,background .15s,border-color .15s}
button:hover{border-color:var(--a)}
button:active{transform:translateY(1px)}
button.primary{background:linear-gradient(135deg,var(--a),var(--a2));border-color:var(--a);color:#fff;font-weight:700;
  box-shadow:0 6px 20px var(--a),inset 0 1px 0 #ffffff33}
button.ghost{background:transparent;box-shadow:none}
button.danger{color:#ff9db1;border-color:#5a2838;background:#251319;box-shadow:none}
.icon{width:38px;height:38px;padding:0;display:grid;place-items:center;font-size:17px;flex:none;border-radius:11px}

/* ---------- library ---------- */
#lib{flex:1;overflow:auto;padding:2px 14px calc(18px + env(safe-area-inset-bottom));display:block}
.welcome{padding:14px 4px 16px}
.welcome h1{margin:0 0 5px;font-size:24px;font-weight:800;letter-spacing:-.01em;
  background:linear-gradient(100deg,var(--txt) 20%,var(--a) 70%,var(--b));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.welcome p{margin:0;color:var(--dim);font-size:13px}
.libActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.libActions button{padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:13px}
.libActions .ic{font-size:21px;line-height:1}
.libActions .primary .ic{filter:drop-shadow(0 2px 6px #0005)}
.searchBox{position:relative;margin-bottom:14px}
.searchBox::before{content:'⌕';position:absolute;left:13px;top:50%;transform:translateY(-52%);color:var(--dim);font-size:19px;pointer-events:none}
#q{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:13px;
  padding:12px 14px 12px 38px;font:inherit;outline:none;transition:border-color .15s}
#q:focus{border-color:var(--a)}
#q::placeholder{color:var(--dim)}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:15px;
  padding:13px 14px;margin-bottom:9px;display:flex;align-items:center;gap:12px;box-shadow:0 3px 14px #0004;
  transition:transform .08s,border-color .15s}
.card:hover{border-color:var(--a)}
.card:active{transform:scale(.985)}
.card .t{font-weight:650;font-size:14px;line-height:1.3}
.card .s{color:var(--dim);font-size:11px;margin-top:4px}
.play{margin-left:auto;color:var(--a);font-size:18px;padding-left:8px;flex:none}
.empty{color:var(--dim);font-size:13px;padding:22px 6px;text-align:center;line-height:1.7}
.empty .emptyIc{font-size:34px;display:block;margin-bottom:8px;opacity:.55}
.hint{color:#5a6379;font-size:10.5px;padding:8px 3px;line-height:1.6}
h3.sec{color:var(--dim);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:18px 4px 8px}
.footNote{text-align:center;padding:16px 4px 6px;color:#4a5268;font-size:10px;line-height:1.7}
.footNote a{color:#6b7490;text-decoration:none;margin:0 6px}

/* ---------- player ---------- */
#play{flex:1;display:none;flex-direction:column;min-height:0}
#stageWrap{flex:1;display:grid;place-items:center;background:#000;min-height:0;position:relative;overflow:hidden}
/* 掌机屏幕质感：内嵌边框 + 顶部玻璃斜光（仅边缘，中间透明，不吃触摸/不影响画面） */
#stageWrap::after{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;
  box-shadow:inset 0 0 0 1px #ffffff12,inset 0 0 22px #000000cc;
  background:linear-gradient(160deg,#ffffff0c 0%,transparent 22%,transparent 100%)}
body.rot90 #stageWrap::after{box-shadow:none;background:none}
#screen{display:block;background:#000;image-rendering:pixelated;image-rendering:crisp-edges}
#glScreen{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;
  background:#000;z-index:1}
#overlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  pointer-events:none;display:none;z-index:2;mix-blend-mode:normal}
#grid{position:absolute;pointer-events:none;display:none;
  background-image:
    linear-gradient(to right,rgba(0,0,0,.30) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(0,0,0,.30) 1px,transparent 1px);
  background-repeat:repeat}
#hud{position:absolute;top:8px;left:10px;font-size:10px;color:#cfd6ea;background:#000a;
  padding:3px 9px;border-radius:8px;pointer-events:none;display:none}
body.showFps #hud{display:block}
body.showFps .fps{display:inline}
#pad{position:relative;height:clamp(150px,33vh,290px);flex:none;touch-action:none;
  opacity:var(--pad-opacity,1);transition:opacity .18s}
/* 手柄连接自动隐藏 / 用户设为始终隐藏时：整块操作区不可见且不吃触摸 */
body.padHidden #pad{display:none}
/* 掌机下沿质感：竖向渐变 + 顶部高光分隔线，衬托实体按键的落地感（横屏时关闭以免挡画面） */
#pad::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:-1;
  background:linear-gradient(180deg,#ffffff08 0%,transparent 8%,transparent 100%),
             radial-gradient(120% 60% at 50% 0%,#ffffff06,transparent 70%),
             linear-gradient(180deg,var(--glow1),transparent 60%);
  border-top:1px solid #ffffff14}
body.rot90 #pad::before{display:none}
/* ===== v1.5 掌机质感重绘：按键立体表面 =====
   皮肤配色仍由 --kb/--kon/--karw 等变量控制（10配色×8形态正交系统完全保留），
   这里只叠加「中性光泽 + 内高光 + 落地阴影」三层伪元素，让任意皮肤都立起来。
   注意：placePad() 用内联 transform 定位按键，按下态一律用 filter/box-shadow，禁用 transform scale。 */
.k{position:absolute;display:grid;place-items:center;border-radius:var(--ks-r,13px);
  background:var(--ks-bg,var(--kb));color:var(--ks-fg,var(--kf));font-weight:700;user-select:none;
  border:var(--ks-bw,1px) solid var(--ks-bc,var(--kedge));box-shadow:var(--ks-sh,var(--kglow));
  backdrop-filter:var(--ks-blur);
  transition:background .08s,box-shadow .08s,filter .06s}
/* 顶层玻璃高光 + 底部暗角：营造凸起的圆润表面 */
.k::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(155deg,#ffffff3d 0%,#ffffff0a 34%,transparent 55%,#0000002e 100%);
  box-shadow:inset 0 1px 1px #ffffff4d,inset 0 -2px 5px #00000055;
  mix-blend-mode:soft-light;opacity:.95}
/* 立体底座：按键与面板之间的接触阴影（比皮肤光晕更深、更实） */
.k::before{content:'';position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;z-index:-1;
  box-shadow:0 3px 5px #00000080,0 6px 14px #00000040}
.k.on{background:var(--ks-on-bg,var(--kon));color:var(--ks-on-fg,var(--kfc));
  box-shadow:var(--ks-on-sh,0 0 16px var(--kon),inset 0 0 0 1px #ffffff33);
  filter:brightness(1.18) saturate(1.1)}
.k.on::after{background:linear-gradient(155deg,#ffffff1f 0%,transparent 40%,#00000045 100%);
  box-shadow:inset 0 2px 6px #00000088,inset 0 1px 0 #ffffff22}
/* 圆形键（A/B）：加一圈内嵌同心环，像真实按键的凹面落指区 */
.k.round::before{content:'';position:absolute;inset:11%;border-radius:50%;z-index:0;
  border:1px solid #ffffff2b;box-shadow:inset 0 2px 5px #0000004d,inset 0 -1px 0 #ffffff14;
  pointer-events:none}
/* 按键文字/箭头压在高光之上；加大加粗提升可读性 */
.k>*{position:relative;z-index:1}
.k.round{border-radius:var(--ks-rd,50%);font-size:clamp(15px,4vw,19px);font-weight:800;letter-spacing:.02em;
  text-shadow:0 1px 2px #00000070}
.k.small{font-size:9px;letter-spacing:.08em;text-shadow:0 1px 2px #00000060}
.a-up{border-bottom:12px solid var(--karw);border-left:9px solid transparent;border-right:9px solid transparent}
.a-down{border-top:12px solid var(--karw);border-left:9px solid transparent;border-right:9px solid transparent}
.a-left{border-right:12px solid var(--karw);border-top:9px solid transparent;border-bottom:9px solid transparent}
.a-right{border-left:12px solid var(--karw);border-top:9px solid transparent;border-bottom:9px solid transparent}
.a-up,.a-down,.a-left,.a-right{filter:drop-shadow(0 1px 1px #00000066)}
/* 按下时方向箭头也换色 */
.k.on .a-up{border-bottom-color:var(--kfc)}
.k.on .a-down{border-top-color:var(--kfc)}
.k.on .a-left{border-right-color:var(--kfc)}
.k.on .a-right{border-left-color:var(--kfc)}
/* 十字键中心：加一个凸起的圆形枢纽，四键围绕更像实体方向键 */
#dpad::after{content:'';position:absolute;left:50%;top:50%;width:26%;height:26%;
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;z-index:0;
  background:linear-gradient(155deg,#ffffff10,#00000030);
  box-shadow:inset 0 1px 1px #ffffff2e,inset 0 -2px 4px #00000066}
/* 减少动态效果偏好：保留质感但去掉过渡 */
@media (prefers-reduced-motion:reduce){.k{transition:none}}

/* ---------- v1.4 按键测试面板 ---------- */
.ktPanel{display:flex;justify-content:space-around;align-items:center;gap:12px;margin:14px 0 6px}
.ktCluster{display:flex;flex-direction:column;align-items:center;gap:6px}
.ktMid{display:flex;align-items:center;gap:6px}
.ktKey{width:46px;height:46px;display:grid;place-items:center;border-radius:12px;font-weight:800;font-size:15px;
  color:var(--dim);background:var(--card2);border:1px solid var(--line);transition:background .07s,color .07s,box-shadow .07s,transform .07s}
.ktKey.on{background:var(--a);color:#fff;box-shadow:0 0 16px var(--a);transform:scale(.94)}
.ktKey.krnd{border-radius:50%}
.ktKey.ksmall{width:38px;height:30px;font-size:11px}
.ktKey.kwide{width:70px;height:30px;font-size:11px}
.ktKey.kdot{width:12px;height:12px;border-radius:50%;background:transparent;border:none}
.ktAB{display:grid;grid-template-columns:repeat(2,46px);gap:8px}
.ktRow{display:flex;justify-content:center;gap:10px;margin:4px 0 12px}
/* 回溯中提示 */
body.rewinding #stageWrap::after{content:'⏪ 回溯中…';position:absolute;top:10px;right:10px;z-index:5;
  background:#000b;color:#7dd3fc;border:1px solid #7dd3fc66;border-radius:8px;padding:4px 10px;font-size:11px;font-weight:700;pointer-events:none}
/* ---------- 主题预览（设置 → 布局）：直接用主题真实色值绘制，避免部分主题下只剩两条空条 ---------- */
.themePrev{height:64px;margin:6px 0 10px;border-radius:11px;overflow:hidden;border:1px solid var(--line);
  display:flex;flex-direction:column;box-shadow:var(--shadow)}
.themePrev .tpHead{height:15px;display:flex;align-items:center;gap:6px;padding:0 10px;flex:none}
.themePrev .tpHead i{display:block;width:9px;height:9px;border-radius:3px}
.themePrev .tpHead span{display:block;width:34px;height:5px;border-radius:4px;opacity:.85;margin-left:auto}
.themePrev .tpBody{flex:1;display:flex;gap:7px;align-items:stretch;padding:0 10px 9px}
.themePrev .tpCard{flex:1;border-radius:6px;border:1px solid}
.themePrev .tpBtn{width:46px;border-radius:6px;flex:none}
/* ---------- 按键皮肤选择器（首页） ---------- */
.skinCard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.skinHead{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);font-weight:600;margin-bottom:8px}
.skinHead .cur{margin-left:auto;color:var(--a);font-weight:700}
.skinGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.skinOpt{position:relative;border-radius:10px;padding:6px 2px 5px;background:var(--bg);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;transition:border-color .12s,background .12s}
.skinOpt:active{transform:translateY(1px)}
.skinOpt.sel{border-color:var(--a);background:var(--card2);box-shadow:0 0 0 1px var(--a) inset}
.skinSwatch{width:30px;height:30px;border-radius:9px;position:relative;overflow:hidden;
  box-shadow:inset 0 0 0 1px #ffffff22}
.skinSwatch::after{content:'';position:absolute;left:50%;top:50%;width:11px;height:11px;border-radius:50%;
  transform:translate(-50%,-50%);background:var(--swOn,#fff);box-shadow:0 0 6px var(--swOn,#fff)}
.skinSwatch::before{content:'';position:absolute;left:4px;top:3px;width:5px;height:5px;
  border-top:2px solid var(--swA,#fff);border-left:2px solid var(--swA,#fff)}
.skinName{font-size:9px;color:var(--dim);line-height:1.1;text-align:center;white-space:nowrap}
.skinOpt.sel .skinName{color:var(--a)}
/* 迷你按键预览 */
.skinPrev{display:flex;align-items:center;justify-content:center;gap:22px;height:66px;margin:6px 0 9px;
  background:var(--bg);border:1px solid var(--line);border-radius:10px;position:relative}
.skinPrev .pvPad{position:relative;width:66px;height:56px}
.skinPrev .pvK{position:absolute;width:20px;height:20px;border-radius:var(--ks-r,6px);
  background:var(--ks-bg,var(--kb));border:var(--ks-bw,1px) solid var(--ks-bc,var(--kedge));
  box-shadow:var(--ks-sh,var(--kglow));display:grid;place-items:center;color:var(--ks-fg,var(--kf));
  backdrop-filter:var(--ks-blur)}
.skinPrev .pvAB{position:relative;width:66px;height:56px}
.skinPrev .pvAB .pvK{border-radius:var(--ks-rd,50%)}
.skinPrev .pvOn{background:var(--ks-on-bg,var(--kon));box-shadow:var(--ks-on-sh,0 0 12px var(--kon));color:var(--ks-on-fg,var(--kfc))}
/* ===== 10 套高端按键配色 ===== */
[data-keytheme="klein"]{--kb:#0b1e6b55;--kf:#c9d8ff;--karw:#9fb8ff;--kon:#1a3fd9ee;--kfc:#fff;--kedge:#3d6bff66;--kglow:inset 0 0 0 1px #4d7bff33;--swA:#bfd2ff;--swOn:#2a55ff}
[data-keytheme="shadow"]{--kb:#0c0e1488;--kf:#aeb4c2;--karw:#9aa1b0;--kon:#2a2e3add;--kfc:#f2f4f8;--kedge:#ffffff14;--kglow:inset 0 1px 0 #ffffff10,0 2px 6px #0008;--swA:#c4cad6;--swOn:#5a6070}
[data-keytheme="obsidian"]{--kb:#18181899;--kf:#e6d49a;--karw:#d9c27e;--kon:#b9922fdd;--kfc:#1a1405;--kedge:#c9a94f55;--kglow:inset 0 0 0 1px #e8cf8a33;--swA:#f0dda1;--swOn:#c19b34}
[data-keytheme="ivory"]{--kb:#f4efe288;--kf:#5c5347;--karw:#7a6f60;--kon:#c7b493ee;--kfc:#2f2a22;--kedge:#a89a8055;--kglow:inset 0 1px 0 #ffffffaa,0 1px 4px #0002;--swA:#8b8071;--swOn:#cbbb9c}
[data-keytheme="sakura"]{--kb:#ffd0e066;--kf:#ff9ec0;--karw:#ffb3ce;--kon:#ff4f8be0;--kfc:#fff;--kedge:#ff8fb466;--kglow:0 0 10px #ff5f9a44;--swA:#ffd0e2;--swOn:#ff5b95}
[data-keytheme="mint"]{--kb:#0d3f3a77;--kf:#8ff0dc;--karw:#7ce6d2;--kon:#12b39ce0;--kfc:#03241f;--kedge:#3ad9c066;--kglow:0 0 10px #1fd8bb44;--swA:#a9f2e4;--swOn:#19c5ac}
[data-keytheme="neon"]{--kb:#2a0b3d88;--kf:#ff8ff5;--karw:#ff9df7;--kon:#e62bffe0;--kfc:#fff;--kedge:#ff5cf066;--kglow:0 0 14px #f03cff77,inset 0 0 8px #ff3cff44;--swA:#ffa8f2;--swOn:#f23cff}
[data-keytheme="vermilion"]{--kb:#4a0d0d77;--kf:#ffb4a4;--karw:#ffa08f;--kon:#e33b23e6;--kfc:#fff;--kedge:#ff6a4d66;--kglow:0 0 10px #ff452244;--swA:#ffc1b1;--swOn:#ef4227}
[data-keytheme="midnight"]{--kb:#14103899;--kf:#b9adff;--karw:#a99cf5;--kon:#5b43d8e6;--kfc:#fff;--kedge:#7c6cff66;--kglow:0 0 11px #6a55ff55;--swA:#cfc6ff;--swOn:#6349e0}
[data-keytheme="sunset"]{--kb:#4a240a77;--kf:#ffc38a;--karw:#ffb074;--kon:#f0801fe6;--kfc:#2a1403;--kedge:#ffab5e66;--kglow:0 0 11px #ff8a2b55;--swA:#ffd0a0;--swOn:#f48a1e}

/* ---------- 按键图案（形态/质感）：与配色 data-keytheme 完全正交 ---------- */
body[data-keyshape="classic"]{--ks-r:13px;--ks-rd:50%}
body[data-keyshape="round"]{--ks-r:50%;--ks-rd:50%}
body[data-keyshape="pill"]{--ks-r:999px;--ks-rd:999px}
body[data-keyshape="flat"]{--ks-r:8px;--ks-rd:8px;--ks-sh:none;--ks-on-sh:none}
body[data-keyshape="outline"]{--ks-bg:transparent;--ks-bw:2px;--ks-bc:var(--kf);--ks-sh:none;--ks-on-sh:0 0 12px var(--kon)}
body[data-keyshape="glass"]{--ks-bg:#ffffff14;--ks-bw:1px;--ks-blur:blur(8px);--ks-sh:inset 0 1px 0 #ffffff33,0 2px 8px #0005}
body[data-keyshape="neo"]{--ks-r:16px;--ks-sh:inset 0 2px 1px #ffffff66,inset 0 -3px 6px #0007,0 4px 8px #0008;--ks-on-sh:inset 0 2px 3px #ffffff44,inset 0 -2px 6px #0008}
body[data-keyshape="halo"]{--ks-bg:#0007;--ks-bc:var(--kon);--ks-sh:0 0 10px var(--kon),inset 0 0 8px #ffffff18;--ks-on-sh:0 0 20px var(--kon),inset 0 0 12px #ffffff55}

/* 图案选择器的小图标 */
.shapeSwatch{width:30px;height:30px;display:grid;place-items:center}
.shapeSwatch b{display:block;width:18px;height:18px;background:var(--a);border:1px solid var(--a)}
[data-shape-ico="classic"] b{border-radius:6px}
[data-shape-ico="round"] b{border-radius:50%}
[data-shape-ico="pill"] b{width:24px;height:12px;border-radius:999px}
[data-shape-ico="outline"] b{border-radius:6px;background:transparent;border:2px solid var(--a)}
[data-shape-ico="glass"] b{border-radius:6px;background:#ffffff33;border:1px solid #ffffffaa}
[data-shape-ico="neo"] b{border-radius:7px;box-shadow:inset 0 2px 0 #ffffff99,0 3px 0 #0006}
[data-shape-ico="halo"] b{border-radius:6px;box-shadow:0 0 10px var(--a),0 0 3px var(--a)}
[data-shape-ico="flat"] b{border-radius:3px}

/* 方向形态切换按钮 */
.shapeGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.modeOpt{border-radius:10px;padding:10px 6px 8px;background:var(--bg);border:1px solid var(--line);
  text-align:center;font-size:12px;font-weight:600;color:var(--dim);cursor:pointer;transition:border-color .12s,background .12s,color .12s}
.modeOpt:active{transform:translateY(1px)}
.modeOpt.sel{border-color:var(--a);background:var(--card2);color:var(--a);box-shadow:0 0 0 1px var(--a) inset}
.mo-dpad{position:relative;width:22px;height:22px;margin:0 auto 6px}
.mo-dpad::before,.mo-dpad::after{content:'';position:absolute;background:currentColor;border-radius:2px}
.mo-dpad::before{left:9px;top:0;width:4px;height:22px}
.mo-dpad::after{left:0;top:9px;width:22px;height:4px}
.mo-stick{position:relative;width:22px;height:22px;margin:0 auto 6px;border-radius:50%;border:2px solid currentColor}
.mo-stick::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:8px;height:8px;border-radius:50%;background:currentColor}

/* ---------- 八向摇杆：方向键可在十字 / 摇杆间切换 ---------- */
#stickBase{display:none;position:absolute;inset:0;border-radius:50%;touch-action:none;
  background:radial-gradient(circle at 50% 38%,#ffffff14,transparent 62%),var(--kb);
  border:2px solid var(--kedge);box-shadow:inset 0 0 14px #0009,var(--kglow)}
#stickBase::before{content:'';position:absolute;inset:9%;border-radius:50%;
  background:repeating-conic-gradient(from -1deg,var(--kf) 0deg 2.5deg,transparent 2.5deg 45deg);
  -webkit-mask:radial-gradient(circle,transparent 54%,#000 56%,#000 66%,transparent 68%);
  mask:radial-gradient(circle,transparent 54%,#000 56%,#000 66%,transparent 68%);opacity:.6}
#stickKnob{display:none;position:absolute;left:50%;top:50%;width:44%;height:44%;
  transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#ffffff99,#ffffff14 46%,transparent 62%),var(--kon);
  border:1px solid #ffffff66;box-shadow:0 5px 12px #000a,inset 0 1px 2px #ffffff88;
  transition:transform .12s ease-out}       /* 松手回中的顺滑过渡 */
#stickKnob.drag{transition:none}            /* 拖动时零延迟，完全跟手、无阻尼 */
body[data-padmode="stick"] #stickBase,
body[data-padmode="stick"] #stickKnob{display:block}
body[data-padmode="stick"] #dpad > .k{display:none}
/* 编辑布局时临时恢复十字，方便拖动定位 */
body.editing[data-padmode="stick"] #dpad > .k{display:grid}
body.editing[data-padmode="stick"] #stickBase,
body.editing[data-padmode="stick"] #stickKnob{display:none}
/* 首页预览里的摇杆示意 */
.pvStick{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:34px;height:34px;border-radius:50%;background:var(--kb);border:2px solid var(--kedge);
  box-shadow:var(--kglow)}
.pvStick i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:15px;height:15px;
  border-radius:50%;background:var(--kon);box-shadow:0 0 8px var(--kon)}
body[data-padmode="stick"] .skinPrev .pvPad > .pvK{display:none}
body[data-padmode="stick"] .skinPrev .pvStick{display:block}

/* ---------- sheet ---------- */
#modal{position:fixed;inset:0;background:#000a;backdrop-filter:blur(3px);display:none;align-items:flex-end;z-index:20}
#modal.on{display:flex}
#sheet{width:100%;background:linear-gradient(180deg,var(--card2),var(--panel) 40%);border-radius:22px 22px 0 0;
  padding:8px 14px calc(16px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);max-height:86vh;overflow:auto;box-shadow:0 -12px 40px #0008}
#sheet::before{content:'';display:block;width:38px;height:4px;border-radius:4px;background:var(--line);margin:2px auto 12px}
#sheet h3{margin:16px 2px 9px;font-size:12px;color:var(--dim);font-weight:700;letter-spacing:.06em;
  display:flex;align-items:center;gap:8px}
#sheet h3:first-of-type{margin-top:4px}
.row{display:flex;gap:8px;margin-bottom:9px}
.row button{flex:1}
.tabs{display:flex;gap:4px;margin:4px 0 6px;background:var(--bg);padding:4px;border-radius:12px}
.tabs button{flex:1;padding:9px 0;font-size:12px;border-radius:9px;background:transparent;border-color:transparent;box-shadow:none;font-weight:600;color:var(--dim)}
.tabs button:hover{background:var(--card);border-color:transparent}
.tabs button.primary{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;box-shadow:0 3px 12px var(--a)}
.slot{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:7px 9px;margin-bottom:7px;font-size:12px}
.slotThumb{width:46px;height:29px;flex:0 0 46px;object-fit:cover;border-radius:5px;
  background:#05060a;border:1px solid #ffffff1a;box-shadow:inset 0 0 0 1px #0008}
.slotThumb.ph{display:grid;place-items:center;color:#5a6379;font-size:15px;
  background:linear-gradient(145deg,var(--card2),var(--bg))}
.slot .n{width:48px;flex:0 0 48px;color:var(--dim)}
.slot .w{flex:1;min-width:0;color:#d3d9ec;font-variant-numeric:tabular-nums}
.slot button{padding:6px 9px;font-size:12px;border-radius:8px}
input[type=range]{accent-color:var(--a);height:20px}
details.adv{border:1px solid var(--line);border-radius:12px;margin:10px 2px;background:var(--bg);overflow:hidden}
details.adv>summary{cursor:pointer;padding:11px 13px;font-size:12px;color:var(--dim);font-weight:600;list-style:none;
  display:flex;align-items:center;gap:7px}
details.adv>summary::-webkit-details-marker{display:none}
details.adv>summary::before{content:'▸';font-size:11px;transition:transform .15s;color:var(--a)}
details.adv[open]>summary::before{transform:rotate(90deg)}
details.adv .advBody{padding:2px 12px 12px}
details.adv .advBody h3{margin:14px 0 8px;font-size:11px}
.badgeOn{font-size:10px;font-weight:700;color:#3ddbc4}
.badgeOff{font-size:10px;font-weight:700;color:#ff9db1}
.builtinTag{display:inline-block;font-size:9px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--a),var(--a2));
  padding:1px 6px;border-radius:5px;vertical-align:middle;margin-left:3px}
@media (orientation:landscape){
  #pad{position:absolute;inset:0;height:auto;max-height:none;min-height:0;pointer-events:none;z-index:5}
  #pad .k{pointer-events:auto}
  #pad #stickBase{pointer-events:auto}   /* 摇杆底座在横屏也要可触摸 */
  #stageWrap{background:#000}
  /* 游戏中物理横屏：隐藏顶栏让画面铺满，改用悬浮菜单 */
  body.inGame header{display:none}
  body.inGame #floatMenu{display:block}
}
#editBar{display:none;position:fixed;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));
  z-index:30;background:var(--panel);border:1px solid var(--a);border-radius:14px;padding:9px 12px;
  align-items:center;gap:10px;font-size:12px;color:var(--txt)}
#editBar button{padding:7px 14px;font-size:12px}
body.editing .k{outline:1px dashed var(--a)}
body.rot90 #play{position:fixed;left:50%;top:50%;width:100vh;height:100vw;
  transform:translate(-50%,-50%) rotate(90deg);background:#000;z-index:8;border-radius:0}
body.rot90 header{display:none}
#exitRot{display:none;position:fixed;right:10px;top:10px;z-index:40;font-size:12px;
  background:var(--panel);border:1px solid var(--a);border-radius:10px;padding:7px 10px}
body.rot90 #exitRot{display:block}
#floatMenu{display:none;position:fixed;left:10px;top:10px;z-index:40;width:40px;height:40px;
  background:#11131dee;border:1px solid #2A3049;border-radius:12px;color:#e9edf9;font-size:18px}
body.rot90 #floatMenu{display:block}
.toast{position:fixed;left:50%;bottom:18%;transform:translateX(-50%);background:#11131dee;border:1px solid #262c42;
  color:#e9edf9;padding:8px 14px;border-radius:12px;font-size:13px;z-index:120;max-width:80vw;text-align:center}

/* ---------- 游戏库导入入口（右下角 FAB + 简洁菜单） ---------- */
#importFab{display:none;position:fixed;right:calc(18px + env(safe-area-inset-right));
  bottom:calc(86px + env(safe-area-inset-bottom));z-index:65;width:56px;height:56px;padding:0;
  border-radius:50%;font-size:31px;line-height:1;align-items:center;justify-content:center;
  color:#fff;background:linear-gradient(135deg,var(--a),var(--a2));border:1px solid var(--a);
  box-shadow:0 8px 24px #0009,0 2px 12px var(--a)}
body.showLib:not(.inGame):not(.rot90):not(.editing) #importFab{display:flex}
#importMenu{display:none;position:fixed;right:calc(18px + env(safe-area-inset-right));
  bottom:calc(152px + env(safe-area-inset-bottom));z-index:66;width:224px;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--shadow)}
body.showLib:not(.inGame):not(.rot90) #importMenu.on{display:block}
#importMenu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:11px 10px;
  font-size:13px;border:none;background:transparent;box-shadow:none;border-radius:9px;color:var(--txt)}
#importMenu button:hover,#importMenu button:active{background:var(--card2);border-color:transparent}
#importMenu .mi{font-size:17px;width:22px;text-align:center;flex:none}

/* ---------- 首页看板（阅读 App 式数据看板） ---------- */
#lib{padding-bottom:calc(70px + env(safe-area-inset-bottom))}   /* 给底部导航留位 */
#homeView{display:block}
#libraryView{display:none}
body.showLib #homeView{display:none}
body.showLib #libraryView{display:block}
.homeHead{display:flex;align-items:center;gap:8px;padding:8px 2px 13px}
.homeHead h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.1;
  background:linear-gradient(100deg,var(--txt) 18%,var(--a) 72%,var(--b));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.homeHead .sub{font-size:11px;color:var(--dim);margin-top:3px}
.homeMore{margin-left:auto;position:relative}
.moreMenu{display:none;position:absolute;right:0;top:43px;width:152px;z-index:70;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:var(--shadow)}
.moreMenu.on{display:block}
.moreMenu button{display:block;width:100%;text-align:left;padding:9px 10px;font-size:12px;border:none;background:transparent;
  box-shadow:none;border-radius:8px;color:var(--txt)}
.moreMenu button:hover{background:var(--card2);border-color:transparent}
.heroCard{position:relative;display:flex;gap:13px;padding:12px;border-radius:18px;margin-bottom:11px;
  background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.heroCard::after{content:'';position:absolute;right:-34px;top:-44px;width:138px;height:138px;border-radius:50%;
  background:radial-gradient(circle,var(--a),transparent 70%);opacity:.16;pointer-events:none}
.heroThumb{width:112px;height:76px;border-radius:11px;flex:none;overflow:hidden;position:relative;background:var(--bg)}
.heroThumb img,.stripThumb img{width:100%;height:100%;object-fit:cover;display:block}
.heroInfo{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:1}
.heroInfo .lb{font-size:10px;color:var(--b);font-weight:700;letter-spacing:.08em}
.heroInfo .nm{font-size:15px;font-weight:750;margin:3px 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heroInfo .ms{font-size:19px;font-weight:800;color:var(--a);font-variant-numeric:tabular-nums}
.heroInfo .lu{font-size:10.5px;color:var(--dim);margin-top:4px}
.heroBar{height:3px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.heroBar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:3px;transition:width .4s}
.homeEmpty{text-align:center;padding:24px 14px;color:var(--dim);font-size:12px;line-height:1.7;width:100%}
.homeEmpty .ic{font-size:34px;display:block;margin-bottom:8px;opacity:.6}
/* 悬浮数据卡：#lib 是首页真正的滚动容器（overflow:auto），#homeView 无 overflow，
   因此 sticky 直接挂在 .statGrid 上即可吸在 header 下方（#lib 顶部 = top:0）。
   sticky 天然占位，不遮挡后续内容；末尾 stickyTail 保证滚到底时目标卡不被压住。 */
.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;
  position:sticky;top:0;z-index:20;margin:0 0 6px;padding:8px 0 10px;
  background:var(--bg);box-shadow:0 10px 14px -14px #0009}
.statCard{display:flex;align-items:center;gap:11px;min-width:0;
  background:linear-gradient(145deg,var(--card2),var(--card));border:1px solid #ffffff10;border-radius:18px;
  padding:11px 12px;box-shadow:0 5px 18px #0003,inset 0 1px 0 #ffffff14}
.statIc{position:relative;width:40px;height:40px;flex:0 0 40px;border-radius:13px;
  display:grid;place-items:center;color:var(--a)}
.statIc::before{content:'';position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(145deg,var(--a),var(--a2));opacity:.18}
.statIc svg{position:relative;width:22px;height:22px;fill:currentColor}
.statIc svg.clock{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.statMeta{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px;overflow:hidden}
/* 注意：统计标签复用了 .k 类名，与虚拟按键 .k{position:absolute} 冲突——必须覆盖回静态定位并禁用按键装饰伪元素 */
.statCard .k{position:static;display:block;border:none;background:none;box-shadow:none;
  font-size:11.5px;font-weight:650;color:var(--dim);
  line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statCard .k::before,.statCard .k::after{content:none;display:none;background:none;box-shadow:none}
.statCard .v{font-size:clamp(20px,6vw,27px);font-weight:800;line-height:1.1;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statCard .v.a{color:var(--a)}
.statCard .v small{font-size:12px;font-weight:650;color:var(--dim);margin-left:3px;letter-spacing:0}
.stickyTail{height:80px;flex:none}
/* 只在首页看板可见时悬浮：切游戏库 / 设置页 / 游戏内 / 横屏一律隐藏 */
body.showLib .statGrid,body.inGame .statGrid,body.settingsOpen .statGrid,body.rot90 .statGrid{display:none}
.stripHead{display:flex;align-items:center;justify-content:space-between;margin:4px 3px 8px}
.stripHead b{font-size:12px;font-weight:700;color:var(--txt)}
.stripHead span{font-size:10px;color:var(--dim)}
.strip{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 7px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.stripItem{flex:none;width:74px;cursor:pointer}
.stripThumb{width:74px;height:50px;border-radius:9px;overflow:hidden;position:relative;background:var(--bg);border:1px solid var(--line)}
.stripItem .nm{font-size:10px;color:var(--dim);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.stripItem .ms{font-size:9px;color:var(--a);text-align:center;font-variant-numeric:tabular-nums}
.ph{width:100%;height:100%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:22px}
.goalCard{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:16px;margin-bottom:10px;
  background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--line);box-shadow:var(--shadow)}
.goalRing{width:76px;height:76px;flex:none;position:relative}
.goalRing svg{width:100%;height:100%;transform:rotate(-90deg)}
.goalRing .track{fill:none;stroke:var(--line);stroke-width:7}
.goalRing .prog{fill:none;stroke:var(--a);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .4s,stroke .3s}
.goalCard.done .goalRing .prog{stroke:var(--b)}
.goalRing .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:800}
.goalInfo{flex:1;min-width:0}
.goalInfo .t{font-size:13px;font-weight:750;color:var(--txt)}
.goalInfo .v{font-size:18px;font-weight:800;margin:3px 0;font-variant-numeric:tabular-nums}
.goalInfo .v em{font-style:normal;color:var(--dim);font-size:12px;font-weight:600}
.goalCard.done .goalInfo .v{color:var(--b)}
.goalEdit{padding:6px 10px;font-size:11px;border-radius:9px;flex:none}
.goalEditRow{display:flex;gap:6px;margin-top:7px}
.goalEditRow input{width:70px;padding:6px 8px;border-radius:8px;background:var(--bg);border:1px solid var(--line);color:var(--txt);font:inherit}
.goalEditRow button{padding:6px 10px;font-size:11px;border-radius:8px}
#bottomNav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:55;gap:6px;
  padding:6px 10px calc(6px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,transparent,var(--bg) 34%);pointer-events:none}
body.inGame #bottomNav,body.rot90 #bottomNav{display:none!important}   /* 游戏/横屏时不挡画面与虚拟按键 */
#bottomNav button{pointer-events:auto;flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:6px 2px;font-size:10px;background:transparent;border:none;box-shadow:none;color:var(--dim);border-radius:11px}
#bottomNav button i{font-style:normal;font-size:18px;line-height:1.1}
#bottomNav button.on{color:var(--a);background:var(--card2)}
@media (max-height:480px){   /* 横屏：看板可滚动，底栏压缩 */
  .homeHead{padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:8px}
  .homeHead h1{font-size:21px}
  .heroThumb{width:92px;height:62px}
  .goalRing{width:60px;height:60px}
  .goalCard{padding:9px 11px}
  .statGrid{padding:4px 0 6px}
  .statCard{padding:7px 10px;border-radius:14px;gap:8px}
  .statIc{width:30px;height:30px;border-radius:10px}
  .statIc svg{width:17px;height:17px}
  .statCard .v{font-size:20px}
  .statCard .v small{font-size:10px}
  .stickyTail{height:56px}
}

/* ---------- 设置页：底部导航的第三个「平级视图」（非弹窗 / 非覆盖浮层） ----------
 * 与首页(#homeView)、游戏库(#libraryView) 同属 switchView 管理体系。
 * 它停在底部导航之上（bottom 留位、z-index 低于 #bottomNav），因此三个标签
 * 在设置页依旧常驻可见、可随时互切；游戏态/横屏下不进入本页。 */
#btnSettings{position:fixed;right:calc(12px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top));
  z-index:60;width:40px;height:40px;padding:0;border-radius:12px;font-size:19px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;border:1px solid var(--a);
  box-shadow:0 4px 16px #0007,inset 0 1px 0 #ffffff33}
#btnSettings:hover{border-color:var(--b)}
#btnSettings:active{transform:translateY(1px)}
body.rot90 #btnSettings{top:calc(60px + env(safe-area-inset-top))}   /* 避开 rot90 的退出横屏按钮 */
body.inGame:not(.rot90) #btnSettings{top:calc(62px + env(safe-area-inset-top))} /* 避开竖屏游戏中 header 的菜单/全屏/旋转按钮 */
body.editing #btnSettings{display:none}
/* 设置页只在非游戏态可用：游戏/横屏/设置页自身都隐藏齿轮快捷入口，避免"出不来" */
body.inGame #btnSettings,body.rot90 #btnSettings,body.settingsOpen #btnSettings{display:none!important}
#settingsPage{position:fixed;left:0;right:0;top:0;bottom:calc(62px + env(safe-area-inset-bottom));
  z-index:50;display:none;flex-direction:column;color:var(--txt);
  background:radial-gradient(120% 80% at 15% -10%,var(--glow1),transparent 55%),
             radial-gradient(100% 70% at 100% 0%,var(--glow2),transparent 45%),var(--bg)}
#settingsPage.on{display:flex}
/* 设置视图激活时：不显示游戏画面/虚拟按键、首页/游戏库与导入入口；底部导航(z-index:55)始终盖在其上 */
body.settingsOpen #play,body.settingsOpen #importFab,body.settingsOpen #importMenu{display:none!important}
body.settingsOpen #homeView,body.settingsOpen #libraryView{display:none!important}
.setHead{flex:none;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;
  border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--panel),transparent)}
.setHead h1{margin:0;font-size:18px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.setSub{font-size:11px;color:var(--dim);white-space:nowrap}
.setClose{margin-left:auto;flex:none;width:40px;height:40px;padding:0;border-radius:12px;font-size:21px;
  display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.setClose:hover{border-color:var(--a);color:var(--a)}
.setBody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:14px 16px calc(26px + env(safe-area-inset-bottom))}
.setSection{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;
  margin-bottom:14px;box-shadow:var(--shadow)}
.setSection h2{margin:0 0 5px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.setCur{margin-left:auto;color:var(--a);font-weight:700;font-size:11px}
.setDesc{margin:0 0 12px;font-size:11.5px;color:var(--dim);line-height:1.6}
/* 一级菜单：7 项，图标 + 名称 + ›，点开进入二级子页 */
.hubList{display:flex;flex-direction:column;gap:9px}
.hubItem{width:100%;display:flex;align-items:center;gap:12px;text-align:left;min-height:62px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 13px;
  box-shadow:var(--shadow);transition:border-color .12s,transform .06s}
.hubItem:hover{border-color:var(--a)}
.hubItem:active{transform:translateY(1px)}
.hubIc{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  font-size:18px;background:var(--bg);border:1px solid var(--line)}
.hubTx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.hubTx b{font-size:14px;font-weight:750;color:var(--txt)}
.hubTx small{font-size:10.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hubArrow{flex:none;color:var(--a);font-size:21px;line-height:1}
/* 二级页头部：位于滚动区之外，横屏矮视口下返回键也常驻可见 */
.setSubHead{flex:none;display:flex;align-items:center;gap:10px;padding:6px 16px;
  border-bottom:1px solid var(--line);background:var(--bg)}
.setSubHead[hidden]{display:none}
.setBack{flex:none;padding:8px 12px;font-size:13px;font-weight:700;border-radius:10px;
  background:var(--card);border:1px solid var(--line);color:var(--a)}
.setBack:hover{border-color:var(--a)}
.setSubTitle{font-size:12px;font-weight:700;color:var(--dim)}
/* 从设置页拉起反馈/诊断弹窗时，浮层需盖在设置视图之上 */
body.settingsOpen #modal{z-index:80}
body.modalTop #modal{z-index:90}   /* 独立弹层（如按键测试）从设置页打开时盖住底部导航 */
.setDiagOut{display:block;max-height:150px;overflow:auto;margin:0 0 10px;padding:10px;
  border-radius:10px;background:var(--bg);border:1px solid var(--line);
  color:var(--dim);font-size:10px;line-height:1.6;white-space:pre-wrap;word-break:break-all}
/* 基础主题：大色板，选一个即整体换肤 */
#settingsPage #uiThemeGrid{grid-template-columns:repeat(4,1fr);gap:10px}
#settingsPage #uiThemeGrid .skinOpt{padding:9px 3px 7px;border-radius:12px}
#settingsPage #uiThemeGrid .skinSwatch{width:100%;height:38px;border-radius:9px}
#settingsPage #uiThemeGrid .skinName{font-size:10px}
#settingsPage .skinPrev{height:72px}
#settingsPage #shapeGrid{grid-template-columns:repeat(4,1fr)}
#settingsPage #padModeGrid{grid-template-columns:repeat(2,1fr)}
.romList{display:flex;flex-direction:column;gap:7px}
.romItem{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);
  border-radius:11px;padding:10px 12px;cursor:pointer;min-width:0}
.romItem:hover{border-color:var(--a)}
.romItem .rn{font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.romItem .rs{font-size:10px;color:var(--dim);margin-top:2px}
.romItem .rp{margin-left:auto;color:var(--a);font-size:17px;flex:none}
.romEmpty{color:var(--dim);font-size:12px;padding:18px 6px;text-align:center;line-height:1.7}
.setActions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
.setActions button{padding:13px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px}
.setActions .ic{font-size:20px;line-height:1}
@media (max-height:480px){   /* 手机横屏：压缩头部与色板，保证整页可滚动、返回键常驻 */
  .setHead{padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:7px}
  .setHead h1{font-size:16px}
  .setClose{width:36px;height:36px}
  .setBody{padding-top:9px}
  .setSection{padding:11px;margin-bottom:10px}
  .hubItem{min-height:52px;padding:8px 11px;border-radius:12px}
  .hubIc{width:32px;height:32px;font-size:16px}
  .hubTx b{font-size:13px}
  .setSubHead{padding:4px 12px}
  .setBack{padding:6px 10px;font-size:12px}
  .themePrev{height:46px}
  #settingsPage #uiThemeGrid{grid-template-columns:repeat(8,1fr);gap:6px}
  #settingsPage #uiThemeGrid .skinSwatch{height:26px}
  #settingsPage .skinPrev{height:58px}
}
</style>
</head>
<body>
<div id="app">
  <header>

    <!-- 游戏库视图：完整保留原有打开/试玩/搜索能力 -->
    <div id="libraryView">
      <div class="welcome">
        <h1>我的掌机</h1>
        <p>把游戏装进来，随时开一局。</p>
      </div>
      <!-- 导入入口已统一到右下角「＋」FAB；下列按钮保留以兼容设置页/旧逻辑，主视图不再展示 -->
      <div class="libActions" style="display:none">

/* ---- 手柄（标准 Gamepad API 映射）----
 * A(0)→A  B(1)→B  LB/LT(4/6)→L  RB/RT(5/7)→R  Back(8)→Select  Start(9)→Start
 * 十字(12-15) + 左摇杆 → 方向；X(2) 单击=快存到档位1，Y(3) 单击=读档位1；
 * Select+Start 同时按 = 打开/关闭游戏菜单。
 */
let gamepadBits = 0, physMask = 0, gpConnected = false, gpPrevX = false, gpPrevY = false, gpPrevMenu = false;
function pollGamepad() {
  if (!gamepadOn || !running) {
    if (gpConnected) { gpConnected = false; applyPadVisibility(); }
    if (gamepadBits) { gamepadBits = 0; recompute(); }
    return;
  }
  let gp = null;
  try {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const p of pads) { if (p && p.connected) { gp = p; break; } }
  } catch (e) {}
  if (!gp) {
    if (gpConnected) { gpConnected = false; toast('手柄已断开'); applyPadVisibility(); }
    if (gamepadBits) { gamepadBits = 0; recompute(); }
    return;
  }
  if (!gpConnected) { gpConnected = true; toast('手柄已连接：' + String(gp.id || 'Gamepad').slice(0, 28)); applyPadVisibility(); }
  const btn = i => !!(gp.buttons[i] && (gp.buttons[i].pressed || gp.buttons[i].value > 0.5));
  let b = 0;
  if (btn(0)) b |= KEYS.A;
  if (btn(1)) b |= KEYS.B;
  if (btn(4) || btn(6)) b |= KEYS.L;
  if (btn(5) || btn(7)) b |= KEYS.R;
  if (btn(9)) b |= KEYS.START;
  if (btn(8)) b |= KEYS.SELECT;
  if (btn(12)) b |= KEYS.UP;
  if (btn(13)) b |= KEYS.DOWN;
  if (btn(14)) b |= KEYS.LEFT;
  if (btn(15)) b |= KEYS.RIGHT;
  const dz = 0.35, ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
  if (ax < -dz) b |= KEYS.LEFT; else if (ax > dz) b |= KEYS.RIGHT;
  if (ay < -dz) b |= KEYS.UP;   else if (ay > dz) b |= KEYS.DOWN;
  if (b !== gamepadBits) { gamepadBits = b; recompute(); }
  // 边沿触发的额外操作
  const x = btn(2), y = btn(3), menu = btn(8) && btn(9);
  if (x && !gpPrevX) quickSlot(1, 'save');
  if (y && !gpPrevY) quickSlot(1, 'load');
  if (menu && !gpPrevMenu) {
    try { if ($('modal').classList.contains('on')) closeSheet(); else if (running) openMenu(); } catch (e) {}
  }
  gpPrevX = x; gpPrevY = y; gpPrevMenu = menu;
}
async function quickSlot(slot, mode) {
  if (!running || !wasm || !romId) return;
  try { if (mode === 'save') await saveState(slot); else await loadState(slot); } catch (e) {}
}

  const newly = phys & ~prevPhysMask;

    try { if (navigator.vibrate) navigator.vibrate(dur); } catch (e) {}
  }
}
function clampRate(r) { return Math.min(30, Math.max(5, Number(r) || 12)); }
function applyTurbo(m) {
  let out = m;

    const half = 500 / clampRate(turboCfg.A.rate);
    if (Math.floor(performance.now() / half) % 2 === 0) out &= ~KEYS.A;
  }
  if (turboCfg.B.on && (m & KEYS.B)) {
    const half = 500 / clampRate(turboCfg.B.rate);
    if (Math.floor(performance.now() / half) % 2 === 0) out &= ~KEYS.B;

    const len = wasm.gba_state_save(), ptr = wasm.gba_state_ptr();
    rwBuf[rwHead] = new Uint8Array(mem.buffer, ptr, len).slice();
    rwHead = (rwHead + 1) % rwBuf.length;
    if (rwCount < rwBuf.length) rwCount++;
    rwCursor = 0;                         // 新快照让回溯指针回到最新
  } catch (e) {}
}
/** 回退一帧：第 1 步载入最新快照，之后依次更早；返回 false 表示到头。 */
function rwStep() {
  if (rwCount === 0 || rwCursor >= rwCount) return false;
  const idx = (rwHead - 1 - rwCursor + rwBuf.length * 2) % rwBuf.length;
  const snap = rwBuf[idx];
  if (!snap) { rwCursor++; return false; }
  try {
    const ptr = wasm.gba_state_ptr();
    new Uint8Array(mem.buffer, ptr, snap.length).set(snap);
    wasm.gba_state_load(snap.length);
    rwCursor++;
    return true;
  } catch (e) { rwCursor++; return false; }
}
function rwStart() {
  if (!rewindOn) { toast('回溯未开启：设置 → 快捷键与回溯 → 开启回溯'); return false; }
  if (rwCount === 0) { toast('还没有可回溯的画面，先玩几秒'); return false; }
  rwActive = true; rwCursor = 0; rwTick = 0;
  document.body.classList.add('rewinding');
  return true;
}
function rwStop() {
  if (!rwActive) return;
  rwActive = false; rwCursor = 0;
  document.body.classList.remove('rewinding');
}
function rwClear() {
  rwActive = false; rwCursor = 0; rwCount = 0; rwHead = 0; rwFrameAcc = 0;
  rwBuf.fill(null);
  document.body.classList.remove('rewinding');
}

/* ================= 音频子系统（AudioWorklet 播放器） =================
 * 对应 core/rust/src/audio.rs：PSG×4 + DMA FIFO×2，wasm 每帧合成 32768Hz
 * 立体声，主线程把 PCM 推给音频线程的环形缓冲，线性重采样到设备采样率。
 * 任何一步失败都静默降级为无声，不影响画面与按键。
 */
let audioVol = parseFloat(localStorage.getItem('audioVol') ?? '70');   // 0..100
let audioMuted = localStorage.getItem('audioMuted') === '1';
let audio = null;            // GbaAudio 实例（用户手势后创建）
let audioOn = false;         // 是否已成功启动音频线程
let audioRetry = 0;          // 音频启动重试次数（上限 5）

const AUDIO_SRC_RATE = 32768;
const AUDIO_RING = 16384;    // 约 0.5s 立体声环形缓冲
const AUDIO_PROCESSOR_SRC = `
class GbaAudioProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.ring = new Float32Array(${AUDIO_RING} * 2);
    this.writePos = 0; this.readPos = 0;
    this.step = ${AUDIO_SRC_RATE} / sampleRate;
    this.silenceUntil = 0; this.currentFrame = 0;
    this.port.onmessage = (e) => {
      const d = e.data;
      if (d.type === 'samples') {
        const src = d.data; const frames = src.length >> 1;
        for (let i = 0; i < frames; i++) {
          const pos = this.writePos % ${AUDIO_RING}; const o = i << 1;
          this.ring[pos * 2] = src[o] / 32768;
          this.ring[pos * 2 + 1] = src[o + 1] / 32768;
          this.writePos++;
        }
      } else if (d.type === 'reset') {
        this.writePos = 0; this.readPos = 0; this.ring.fill(0);
      }
    };
  }
  process(inputs, outputs) {
    const out = outputs[0];
    if (!out || out.length === 0) return true;
    const left = out[0], right = out[1] || out[0], n = left.length;
    for (let i = 0; i < n; i++) {
      const avail = this.writePos - this.readPos;
      if (avail < 2 || this.currentFrame < this.silenceUntil) {
        left[i] = 0; right[i] = 0; this.currentFrame++; continue;
      }
      const base = Math.floor(this.readPos), frac = this.readPos - base;
      const i0 = base % ${AUDIO_RING}, i1 = (base + 1) % ${AUDIO_RING};
      const l0 = this.ring[i0 * 2], l1 = this.ring[i1 * 2];
      const r0 = this.ring[i0 * 2 + 1], r1 = this.ring[i1 * 2 + 1];
      left[i] = l0 + (l1 - l0) * frac;
      right[i] = r0 + (r1 - r0) * frac;
      this.readPos += this.step;
      if (this.writePos - this.readPos > ${AUDIO_RING} - 2) {
        this.readPos = this.writePos;
        this.silenceUntil = this.currentFrame + 64;
      }
      this.currentFrame++;
    }
    return true;
  }
}
registerProcessor('gba-audio-processor', GbaAudioProcessor);
`;

class GbaAudio {
  constructor() {
    this.ctx = null; this.node = null; this.gain = null;
    this.mode = '';        // 'worklet' | 'script'（file:// 降级）
    // ScriptProcessor 降级用的环形缓冲（Float32 交错 L,R）
    this.spRing = new Float32Array(AUDIO_RING * 2);
    this.spWrite = 0; this.spRead = 0; this.spStep = AUDIO_SRC_RATE / 48000;
  }
  /** 必须在用户手势里调用。AudioWorklet 失败时自动降级到 ScriptProcessor。 */
  async start() {
    if (this.ctx && this.node) { await this.ctx.resume(); return; }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) throw new Error('无 WebAudio');
    this.ctx = this.ctx || new Ctx({ latencyHint: 'interactive' });
    // 先试 AudioWorklet（http(s) 下工作良好）
    if (!this.node && this.ctx.audioWorklet) {
      try {
        const blob = new Blob([AUDIO_PROCESSOR_SRC], { type: 'application/javascript' });
        const url = URL.createObjectURL(blob);
        try { await this.ctx.audioWorklet.addModule(url); }
        finally { URL.revokeObjectURL(url); }
        this.node = new AudioWorkletNode(this.ctx, 'gba-audio-processor', {
          numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2]
        });
        this.mode = 'worklet';
      } catch (e) { /* 落到 ScriptProcessor 降级 */ }
    }
    if (!this.node) {
      // ScriptProcessorNode：file:// 下可靠，对 GBA 低负载足够。
      const sp = this.ctx.createScriptProcessor(1024, 0, 2);
      this.spStep = AUDIO_SRC_RATE / this.ctx.sampleRate;
      sp.onaudioprocess = (ev) => {
        const L = ev.outputBuffer.getChannelData(0), R = ev.outputBuffer.getChannelData(1);
        for (let i = 0; i < L.length; i++) {
          const avail = this.spWrite - this.spRead;
          if (avail < 2) { L[i] = 0; R[i] = 0; continue; }
          const base = Math.floor(this.spRead), frac = this.spRead - base;
          const i0 = base % AUDIO_RING, i1 = (base + 1) % AUDIO_RING;
          L[i] = this.spRing[i0 * 2] + (this.spRing[i1 * 2] - this.spRing[i0 * 2]) * frac;
          R[i] = this.spRing[i0 * 2 + 1] + (this.spRing[i1 * 2 + 1] - this.spRing[i0 * 2 + 1]) * frac;
          this.spRead += this.spStep;
          if (this.spWrite - this.spRead > AUDIO_RING - 2) this.spRead = this.spWrite;
        }
      };
      this.node = sp;
      this.mode = 'script';
    }
    this.gain = this.ctx.createGain();
    this.gain.gain.value = audioMuted ? 0 : (audioVol / 100);
    this.node.connect(this.gain); this.gain.connect(this.ctx.destination);
    if (this.ctx.state === 'suspended') await this.ctx.resume();
  }
  push(memory, ptr, count) {
    if (!this.node || count <= 0) return;
    const view = new Int16Array(memory.buffer, ptr, count);
    if (this.mode === 'worklet') {
      const copy = new Int16Array(view);
      this.node.port.postMessage({ type: 'samples', data: copy }, [copy.buffer]);
    } else {
      // ScriptProcessor：直接写入自己的环形缓冲
      for (let i = 0; i < (count >> 1); i++) {
        const pos = this.spWrite % AUDIO_RING, o = i << 1;
        this.spRing[pos * 2] = view[o] / 32768;
        this.spRing[pos * 2 + 1] = view[o + 1] / 32768;
        this.spWrite++;
      }
    }
  }
  reset() {
    if (!this.node) return;
    if (this.mode === 'worklet') this.node.port.postMessage({ type: 'reset' });
    else { this.spWrite = 0; this.spRead = 0; this.spRing.fill(0); }
  }
  setVolume(v, muted) {
    if (!this.gain || !this.ctx) return;
    this.gain.gain.setTargetAtTime(muted ? 0 : (v / 100), this.ctx.currentTime, 0.01);
  }
  async suspend() { if (this.ctx && this.ctx.state === 'running') await this.ctx.suspend(); }
  async resume()  { if (this.ctx && this.ctx.state === 'suspended') await this.ctx.resume(); }
  get sampleRate() { return this.ctx ? this.ctx.sampleRate : 0; }
}

/** 用户手势里启动音频；失败静默降级。用 Promise 锁避免并发重复启动。 */
let audioStartPromise = null;
function audioStart() {
  if (audioOn && audio) { audio.resume(); return Promise.resolve(true); }
  if (audioStartPromise) return audioStartPromise;
  audioStartPromise = (async () => {
    try {
      if (!audio) audio = new GbaAudio();
      await audio.start();
      audioOn = true;
      audio.reset();
      return true;
    } catch (e) {
      audioOn = false;
      // file:// 下 AudioWorklet 首次 addModule 偶发失败：丢弃 ctx 以便下次完整重试
      try { audio && audio.ctx && audio.ctx.close(); } catch (_) {}
      audio = null;
      return false;
    }
    finally { audioStartPromise = null; }
  })();
  return audioStartPromise;
}
function audioPushFrame() {
  if (!audioOn || !wasm || !audio) return;
  // 快进时 wasm 合成音频的速度是播放消费速度的 speed 倍，会把环形缓冲撑爆，
  // 表现为爆音/断续/卡顿。快进期间停推音频（静音），切回 1× 时由按钮重置缓冲。
  if (speed > 1) return;
  try {
    const frames = wasm.gba_audio_frames();
    if (frames > 0) audio.push(mem, wasm.gba_audio_ptr(), frames * 2);
  } catch (e) { /* 音频失败不影响游戏 */ }
}
function audioApplyVolume() {
  if (audio) audio.setVolume(audioVol, audioMuted);
}

/* ================= storage =================
 * 三级链路：IndexedDB（主）→ 内存 Map（本次会话）→ localStorage（跨刷新兜底）。
 * 移动端 file:// 下 IndexedDB 常被禁（尤其 iOS Safari），小体积数据以 base64 落到
 * localStorage 实现跨刷新存档；ROM 本体过大不落盘（仅本次会话可从内存游玩）。
 * 任何存储失败都被吞掉，绝不阻断"打开游戏/存档/读档"主流程。 */
let dbp = null;
const MEM_KV = new Map();                 // 内存兜底（始终写一份）
let useMem = false;
const LS_NS = 'gba60:';                   // localStorage 命名空间，与设置项键隔离

// ---- localStorage 编解码：二进制走 base64，分块避免 String.fromCharCode.apply 栈溢出 ----
function bytesToB64(u8) {
  let s = ''; const CH = 0x8000;
  for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
  return btoa(s);
}
function lsEncode(v) {
  if (v instanceof Uint8Array) return JSON.stringify({ t: 'u8', d: bytesToB64(v) });
  if (v instanceof ArrayBuffer) return JSON.stringify({ t: 'ab', d: bytesToB64(new Uint8Array(v)) });
  if (typeof v === 'number') return JSON.stringify({ t: 'num', d: v });
  // ROM 记录：只留元数据，剥离 bytes（30+MB 绝不进 localStorage）
  if (v && typeof v === 'object' && v.bytes) {
    const o = {};
    for (const k in v) if (k !== 'bytes') o[k] = v[k];
    o.noBytes = true;
    return JSON.stringify({ t: 'json', d: o });
  }
  return JSON.stringify({ t: 'json', d: v });
}
function lsDecode(s) {
  const o = JSON.parse(s);
  if (o.t === 'u8') return b64(o.d);
  if (o.t === 'ab') return b64(o.d).buffer;
  return o.d;
}
function lsPut(k, v) {
  try { localStorage.setItem(LS_NS + k, lsEncode(v)); }
  catch (e) { /* 配额超限/被禁：静默降级，本次会话内存兜底仍可用 */ }
}
function lsGet(k) {
  try { const s = localStorage.getItem(LS_NS + k); return s == null ? undefined : lsDecode(s); }
  catch (e) { return undefined; }
}
function lsDel(k) { try { localStorage.removeItem(LS_NS + k); } catch (e) {} }
function lsKeys() {
  const out = [];
  try { for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith(LS_NS)) out.push(k.slice(LS_NS.length));
  } } catch (e) {}
  return out;
}
function db() {
  if (dbp) return dbp;
  dbp = new Promise((res) => {
    let r;
    try {
      if (!window.indexedDB) throw new Error('no indexedDB');
      r = indexedDB.open('gba60', 2);
    } catch (e) { useMem = true; res(null); return; }
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('kv')) r.result.createObjectStore('kv'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => { useMem = true; res(null); };
    r.onblocked = () => { useMem = true; res(null); };
  });
  return dbp;
}
async function idbGet(k) {
  const d = await db();
  let v;
  if (useMem || !d) {
    v = MEM_KV.get(k);
  } else {
    v = await new Promise((res) => {
      try { const t = d.transaction('kv').objectStore('kv').get(k);
        t.onsuccess = () => res(t.result); t.onerror = () => res(undefined); }
      catch (e) { res(undefined); }
    });
  }
  if (v === undefined) v = lsGet(k);                      // localStorage 二级兜底
  if (v !== undefined && !MEM_KV.has(k)) MEM_KV.set(k, v); // 回填本次会话
  return v;
}
async function idbPut(k, v) {
  MEM_KV.set(k, v);                       // 内存始终写一份，保证本次会话可用
  const d = await db();
  if (useMem || !d) { lsPut(k, v); return; }
  return new Promise((res) => {
    try { const t = d.transaction('kv', 'readwrite').objectStore('kv').put(v, k);
      t.onsuccess = () => res(); t.onerror = () => { lsPut(k, v); res(); }; }
    catch (e) { lsPut(k, v); res(); }
  });
}
async function idbDel(k) {
  MEM_KV.delete(k);
  lsDel(k);                               // 持久化副本同步删除
  const d = await db();
  if (useMem || !d) return;
  return new Promise((res) => {
    try { const t = d.transaction('kv', 'readwrite').objectStore('kv').delete(k);
      t.onsuccess = () => res(); t.onerror = () => res(); }
    catch (e) { res(); }
  });
}
async function idbKeys() {
  const d = await db();
  let ks;
  if (useMem || !d) {
    ks = [...MEM_KV.keys()];
  } else {
    ks = await new Promise((res) => {
      try { const t = d.transaction('kv').objectStore('kv').getAllKeys();
        t.onsuccess = () => {
          const r = t.result || [];
          // 合并内存里可能尚未落库/落库失败的键
          for (const m of MEM_KV.keys()) if (!r.includes(m)) r.push(m);
          res(r);
        };
        t.onerror = () => res([...MEM_KV.keys()]); }
      catch (e) { res([...MEM_KV.keys()]); }
    });
  }
  for (const m of lsKeys()) if (!ks.includes(m)) ks.push(m); // 合并跨刷新持久化键
  return ks;
}

/* ================= 游玩时长统计（gba60:stats） =================
 * 口径：只有"游戏正在运行 且 页面可见"才累计；每 1s 记一次账，每 5s 节流写盘。
 * 存储：复用 lsPut/lsGet -> localStorage['gba60:stats']，全程 try/catch，
 *       任何存储/抓帧异常都被吞掉，绝不中断模拟器主流程。 */
const STATS_KEY = 'stats';                    // 完整键 = LS_NS + 'stats' = 'gba60:stats'
const STATS_TICK_MS = 1000;
const STATS_FLUSH_MS = 5000;
const THUMB_MAX = 20 * 1024;                  // 单张缩略图 dataURL 字符上限（约 20KB）
let statsDirty = false;
let statsLastTick = 0;
let thumbScheduled = false;

function defaultStats() {
  return { totalMs: 0, games: {}, days: {}, dailyGoalMin: 30 };
}
function loadStats() {
  const d = defaultStats();
  try {
    const s = lsGet(STATS_KEY);
    if (!s || typeof s !== 'object') return d;
    if (Number.isFinite(s.totalMs) && s.totalMs >= 0) d.totalMs = s.totalMs;
    if (s.games && typeof s.games === 'object') {
      for (const k of Object.keys(s.games)) {
        const g = s.games[k];
        if (g && typeof g === 'object' && Number.isFinite(g.ms)) {
          d.games[k] = {
            name: String(g.name || k),
            ms: g.ms,
            lastPlayed: Number(g.lastPlayed) || 0,
            thumb: typeof g.thumb === 'string' ? g.thumb : ''
          };
        }
      }
    }
    if (s.days && typeof s.days === 'object') {
      for (const k of Object.keys(s.days)) if (Number.isFinite(s.days[k])) d.days[k] = s.days[k];
    }
    if (Number.isFinite(s.dailyGoalMin) && s.dailyGoalMin > 0) {
      d.dailyGoalMin = Math.min(1440, Math.max(1, Math.round(s.dailyGoalMin)));
    }
  } catch (e) { /* 坏数据/被禁：用默认统计，不影响启动 */ }
  return d;
}
const stats = loadStats();
function saveStats() {
  try { lsPut(STATS_KEY, stats); statsDirty = false; }
  catch (e) { /* 配额超限：静默降级，本次会话内存里仍有数据 */ }
}
function statsFlush() { if (statsDirty) saveStats(); }

function dayKey(ts) {
  const d = new Date(ts || Date.now());
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
/** 友好的时长文案：<60 分钟显示分钟，否则显示一位小数小时。 */
function fmtDuration(ms) {
  const m = Math.floor((Number(ms) || 0) / 60000);
  return m < 60 ? m + ' 分钟' : (m / 60).toFixed(1) + ' 小时';
}
/** 展示名优先取 allRows 的 title/name，保证与游戏库一致。 */
function statsNameOf(id, fallback) {
  try {
    const r = allRows.find(x => x.id === id);
    if (r) return r.title || r.name || fallback || id;
  } catch (e) { /* allRows 尚未就绪 */ }
  return fallback || id;
}
/** 打开游戏时登记展示名（不计时；计时只由 statsTick 负责）。 */
function statsNoteOpen(id, name) {
  if (!id) return;
  try {
    const g = stats.games[id] || (stats.games[id] = { name: '', ms: 0, lastPlayed: 0, thumb: '' });
    g.name = statsNameOf(id, name || id);
    statsDirty = true;
  } catch (e) {}
}
function statsTick() {
  const now = Date.now();
  if (!statsLastTick) { statsLastTick = now; return; }
  const raw = now - statsLastTick;
  statsLastTick = now;
  if (!running || !romId || document.hidden) return;      // 暂停 / 后台 / 未在游戏：不计
  if (raw <= 0 || raw > 5000) return;                      // 丢弃后台节流或休眠造成的大间隔
  try {
    const g = stats.games[romId] || (stats.games[romId] = { name: '', ms: 0, lastPlayed: 0, thumb: '' });
    g.name = statsNameOf(romId, romName || g.name);
    g.ms += raw;
    g.lastPlayed = now;
    stats.totalMs += raw;
    const dk = dayKey(now);
    stats.days[dk] = (stats.days[dk] || 0) + raw;
    statsDirty = true;
  } catch (e) {}
}
// ---- 读取接口 ----
function statsTotal() { return stats.totalMs || 0; }
function statsGame(id) { return stats.games[id] || null; }
function statsToday() { try { return stats.days[dayKey(Date.now())] || 0; } catch (e) { return 0; } }
function statsRecent(limit) {
  try {
    return Object.keys(stats.games)
      .map(id => Object.assign({ id }, stats.games[id]))
      .filter(g => g.ms > 0 || g.lastPlayed)
      .sort((a, b) => (b.lastPlayed || 0) - (a.lastPlayed || 0))
      .slice(0, limit || 8);
  } catch (e) { return []; }
}
function statsDays() {
  try { return Object.keys(stats.days).sort().map(d => ({ day: d, ms: stats.days[d] })); }
  catch (e) { return []; }
}

/* ---- 模块 C：运行后抓一帧缩略图（WebGL 取 #glScreen，2D 取 #screen） ----
 * grabFrameThumb 是纯抓帧函数，返回 dataURL 或 null；首页封面与存档槽位共用，
 * 保证「存档时的画面」与缩略图来自同一条渲染路径。 */
function grabFrameThumb() {
  const glPath = (typeof useGL === 'function' && useGL() && GL.ok);
  const src = glPath ? $('glScreen') : cv;
  if (!src || !src.width || !src.height) return null;
  const c = document.createElement('canvas');
  c.width = 160; c.height = 100;
  const cx = c.getContext('2d');
  cx.fillStyle = '#05060a';
  cx.fillRect(0, 0, 160, 100);
  cx.drawImage(src, 0, 0, src.width, src.height, 0, 0, 160, 100);
  let url = '';
  try { url = c.toDataURL('image/webp', 0.6); } catch (e) {}
  if (!url || url.indexOf('data:image/') !== 0 || url.length > THUMB_MAX) {
    url = c.toDataURL('image/jpeg', 0.6);       // WebP 不可用/过大则退 JPEG
  }
  if (!url || url.indexOf('data:image/') !== 0 || url.length > THUMB_MAX) return null; // 仍超限：跳过缩略图，保留文字
  return url;
}
function captureThumb() {
  if (!romId || !running) return;
  try {
    const url = grabFrameThumb();
    if (!url) return;
    const g = stats.games[romId];
    if (!g) return;
    g.thumb = url;
    statsDirty = true;
    statsFlush();
  } catch (e) { /* 抓帧失败绝不影响游戏 */ }
}
function scheduleThumb() {
  if (thumbScheduled) return;
  thumbScheduled = true;
  setTimeout(() => {
    thumbScheduled = false;
    requestAnimationFrame(() => { try { captureThumb(); } catch (e) {} });
  }, 1500);
}
/** 有缩略图显示图片；否则用名字首字 + 由名字 hash 出的渐变色块（纯 CSS，无外链）。 */
function thumbHTML(g, title, cls) {
  const name = String(title || (g && g.name) || '?');
  if (g && g.thumb && g.thumb.indexOf('data:image/') === 0) {
    return '<img class="' + cls + '" src="' + g.thumb + '" alt="">';
  }
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  const hue = h % 360;
  return '<div class="' + cls + ' ph" style="background:linear-gradient(135deg,hsl(' + hue +
    ' 62% 46%),hsl(' + ((hue + 48) % 360) + ' 58% 24%))">' +
    esc((name.trim().charAt(0) || '?').toUpperCase()) + '</div>';
}

/* ---- 模块 B0：看板刷新调度（统一入口 + 节流 + 轻量更新） ----
 * 统计引擎每 1s 改内存、每 5s 落盘；DOM 只在明确刷新时读取一次。
 * 这里把「进入首页 / 切 tab 返回 / 从游戏退出 / 页面重新可见 / 定时兜底」
 * 统一到同一条刷新链：结构变化走 renderHome（完整重建），纯数值变化走
 * updateHomeValues（只改文本/圆环，不重建封面与点击绑定，避免闪跳）。 */
const HOME_CYCLE_MS = 8000;      // 定时兜底间隔（落在 5–15s 推荐区间）
const HOME_MIN_GAP_MS = 700;     // 节流最小间隔：合并同一帧内的多次刷新请求
let homeLastRefreshAt = 0;
let homeRefreshTimer = 0;

function homeIsVisible() {
  try {
    return !document.hidden
      && !document.body.classList.contains('inGame')
      && !document.body.classList.contains('showLib')
      && !document.body.classList.contains('settingsOpen')
      && !$('settingsPage').classList.contains('on')
      && !!$('homeView');
  } catch (e) { return false; }
}

/** 把 "12.3 小时" 拆成文本节点 + <small>小时</small>，避免整块 innerHTML 重写造成闪跳。 */
function setNumSmall(el, text) {
  if (!el) return;
  const s = String(text || '');
  const sp = s.lastIndexOf(' ');
  const num = sp > 0 ? s.slice(0, sp) : s;
  const unit = sp > 0 ? s.slice(sp + 1) : '';
  let t = el.firstChild;
  if (!t || t.nodeType !== 3) { t = document.createTextNode(''); el.insertBefore(t, el.firstChild); }
  if (t.nodeValue !== num) t.nodeValue = num;
  let sm = el.querySelector('small');
  if (unit) {
    if (!sm) { sm = document.createElement('small'); el.appendChild(sm); }
    if (sm.textContent !== unit) sm.textContent = unit;
  } else if (sm) sm.remove();
}

/** 轻量刷新：只同步数值、时长文案与目标圆环；不动 hero/strip 的 DOM 结构。 */
function updateHomeValues() {
  const recent = statsRecent(12);
  const byId = {};
  for (const g of recent) byId[g.id] = g;

  setNumSmall($('statGames'), (allRows.length || 0) + ' 款');
  setNumSmall($('statTotal'), fmtDuration(statsTotal()));

  const hero = $('heroCard');
  if (recent.length && hero) {
    const g = recent[0];
    const ms = hero.querySelector('.ms');
    if (ms) { const v = fmtDuration(g.ms); if (ms.textContent !== v) ms.textContent = v; }
    const lu = hero.querySelector('.lu');
    if (lu) { const v = '上次游玩：' + fmt(g.lastPlayed); if (lu.textContent !== v) lu.textContent = v; }
    const bar = hero.querySelector('.heroBar i');
    if (bar) {
      const pct = Math.min(100, Math.round(statsToday() / Math.max(1, stats.dailyGoalMin * 60000) * 100)) + '%';
      if (bar.style.width !== pct) bar.style.width = pct;
    }
  }

  const strip = $('recentStrip');
  if (strip) strip.querySelectorAll('.stripItem').forEach(el => {
    const g = byId[el.dataset.id];
    const ms = el.querySelector('.ms');
    if (g && ms) { const v = fmtDuration(g.ms); if (ms.textContent !== v) ms.textContent = v; }
  });

  const goal = Math.max(1, stats.dailyGoalMin || 30);
  const today = statsToday();
  const done = today >= goal * 60000;
  const p = Math.min(1, today / (goal * 60000));
  const C = 2 * Math.PI * 42;
  const prog = $('goalProg');
  if (prog) {
    const dash = C.toFixed(1);
    if (prog.style.strokeDasharray !== dash) prog.style.strokeDasharray = dash;
    const off = (C * (1 - p)).toFixed(1);
    if (prog.style.strokeDashoffset !== off) prog.style.strokeDashoffset = off;
  }
  const pctEl = $('goalPct');
  if (pctEl) { const v = Math.round(p * 100) + '%'; if (pctEl.textContent !== v) pctEl.textContent = v; }
  const gt = $('goalText');
  if (gt) {
    const lead = Math.floor(today / 60000) + ' / ' + goal + ' ';
    if (gt.firstChild && gt.firstChild.nodeType === 3) {
      if (gt.firstChild.nodeValue !== lead) gt.firstChild.nodeValue = lead;
    } else gt.innerHTML = lead + '<em>分钟</em>';
    let party = gt.querySelector('.goalParty');
    if (done && !party) { party = document.createElement('b'); party.className = 'goalParty'; party.textContent = '🎉'; gt.appendChild(party); }
    else if (!done && party) party.remove();
  }
  const gc = $('goalCard');
  if (gc) gc.classList.toggle('done', done);
}

/** 统一刷新入口：'full' 结构重建（进入/返回/可见）；'values' 轻量更新（定时兜底）。 */
function scheduleHomeRefresh(mode) {
  if (mode === 'full') {
    if (homeRefreshTimer) { clearTimeout(homeRefreshTimer); homeRefreshTimer = 0; }
    homeLastRefreshAt = Date.now();
    renderHome();
    return;
  }
  if (homeRefreshTimer || !homeIsVisible()) return;
  const wait = Math.max(0, HOME_MIN_GAP_MS - (Date.now() - homeLastRefreshAt));
  homeRefreshTimer = setTimeout(() => {
    homeRefreshTimer = 0;
    homeLastRefreshAt = Date.now();
    if (homeIsVisible()) updateHomeValues();
  }, wait);
}

/* ---- 模块 B：看板首页渲染 + 底部导航 ---- */
function renderHome() {
  const hero = $('heroCard'); if (!hero) return;
  const recent = statsRecent(12);
  if (!recent.length) {
    hero.innerHTML = '<div class="homeEmpty"><span class="ic">🎮</span>还没有游玩记录<br>去游戏库开一局，时光就会被记录下来</div>';
    hero.onclick = null;
    hero.style.cursor = 'default';
  } else {
    const g = recent[0];
    const pct = Math.min(100, Math.round(statsToday() / Math.max(1, stats.dailyGoalMin * 60000) * 100));
    hero.innerHTML = '<div class="heroThumb">' + thumbHTML(g, g.name, '') + '</div>' +
      '<div class="heroInfo"><div class="lb">最近游玩</div>' +
      '<div class="nm">' + esc(g.name) + '</div>' +
      '<div class="ms">' + fmtDuration(g.ms) + '</div>' +
      '<div class="lu">上次游玩：' + fmt(g.lastPlayed) + '</div>' +
      '<div class="heroBar"><i style="width:' + pct + '%"></i></div></div>';
    hero.style.cursor = 'pointer';
    hero.onclick = () => {
      const r = allRows.find(x => x.id === g.id);
      if (r) openRow(r); else toast('该游戏已不在列表中');
    };
  }
  const strip = $('recentStrip');
  strip.innerHTML = recent.length ? recent.slice(0, 10).map(g =>
    '<div class="stripItem" data-id="' + esc(g.id) + '"><div class="stripThumb">' +
    thumbHTML(g, g.name, '') + '</div><div class="nm">' + esc(g.name) + '</div>' +
    '<div class="ms">' + fmtDuration(g.ms) + '</div></div>').join('') :
    '<div class="homeEmpty" style="padding:12px;width:100%">玩过的游戏会出现在这里</div>';
  strip.querySelectorAll('.stripItem').forEach(el => {
    el.onclick = () => {
      const r = allRows.find(x => x.id === el.dataset.id);
      if (r) openRow(r); else toast('该游戏已不在列表中');
    };
  });

  // 数值与圆环统一交给轻量刷新，避免和定时刷新出现两套口径
  updateHomeValues();
}
/** 记录进入设置页之前的视图，供右上角 × / Esc 返回（默认首页）。 */
let settingsReturnView = 'home';
let settingsOpen = false;      // 与 body.settingsOpen 同步，供键盘输入隔离逻辑使用
let settingsSub = '';          // 当前二级子页 key；空串 = 停在一级菜单

/** 三视图统一切换：home / lib / settings，三者平级、底部导航常驻。
 *  'set' 是底部导航 data-nav 的历史取值，等价于 'settings'。 */
function switchView(v) {
  const set = (v === 'settings' || v === 'set');
  const lib = !set && v === 'lib';
  // 设置页只在非游戏态可用：游戏/横屏下底部导航本就隐藏，齿轮也已隐藏。
  if (set && (document.body.classList.contains('inGame') ||
              document.body.classList.contains('rot90'))) return;

  const wasSettings = document.body.classList.contains('settingsOpen');
  if (set && !wasSettings) {
    settingsReturnView = document.body.classList.contains('showLib') ? 'lib' : 'home';
    // 每次进入设置视图都从一级菜单开始；二级页由用户点选进入
    showSettingsHub();
  }

  document.body.classList.toggle('showLib', lib);
  document.body.classList.toggle('settingsOpen', set);
  // settingsOpen 变量与键盘输入隔离逻辑共用，保持同步
  settingsOpen = set;

  const sp = $('settingsPage');
  if (sp) {
    sp.classList.toggle('on', set);
    sp.setAttribute('aria-hidden', set ? 'false' : 'true');
  }
  // 三个标签全部保留，当前视图高亮（设置页高亮「设置」）
  document.querySelectorAll('#bottomNav button').forEach(b =>
    b.classList.toggle('on', b.dataset.nav === (set ? 'set' : (lib ? 'lib' : 'home'))));

  // 进入首页（含从游戏/设置退出后切回）统一走完整刷新
  if (!lib && !set) scheduleHomeRefresh('full');
  // 切到设置页且正停在「其它」子页（含游戏管理）时，刷新游戏列表
