async function sha1Hex(bytes) {
  if (crypto.subtle) {
    try {
      const h = await crypto.subtle.digest('SHA-1', bytes);
      return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 16);
    } catch (e) {}
  }
  return sha1Pure(bytes).slice(0, 16);
}
/** SHA-1 fallback for file:// pages where crypto.subtle is unavailable. */
function sha1Pure(msg) {
  const ml = msg.length, blocks = ((ml + 8) >> 6) + 1, words = new Uint32Array(blocks * 16);
  for (let i = 0; i < ml; i++) words[i >> 2] |= msg[i] << (24 - (i % 4) * 8);
  words[ml >> 2] |= 0x80 << (24 - (ml % 4) * 8);
  words[blocks * 16 - 1] = ml * 8;
  let h0 = 0x67452301, h1 = 0xEFCDAB89, h2 = 0x98BADCFE, h3 = 0x10325476, h4 = 0xC3D2E1F0;
  const w = new Uint32Array(80);
  for (let i = 0; i < blocks * 16; i += 16) {
    for (let t = 0; t < 16; t++) w[t] = words[i + t];
    for (let t = 16; t < 80; t++) { const x = w[t-3] ^ w[t-8] ^ w[t-14] ^ w[t-16]; w[t] = (x << 1) | (x >>> 31); }
    let a = h0, b = h1, c = h2, d = h3, e = h4;
    for (let t = 0; t < 80; t++) {
      let f, k;
      if (t < 20) { f = (b & c) | ((~b) & d); k = 0x5A827999; }
      else if (t < 40) { f = b ^ c ^ d; k = 0x6ED9EBA1; }
      else if (t < 60) { f = (b & c) | (b & d) | (c & d); k = 0x8F1BBCDC; }
      else { f = b ^ c ^ d; k = 0xCA62C1D6; }
      const tmp = (((a << 5) | (a >>> 27)) + f + e + k + w[t]) >>> 0;
      e = d; d = c; c = ((b << 30) | (b >>> 2)) >>> 0; b = a; a = tmp;
    }
    h0 = (h0 + a) >>> 0; h1 = (h1 + b) >>> 0; h2 = (h2 + c) >>> 0; h3 = (h3 + d) >>> 0; h4 = (h4 + e) >>> 0;
  }
  return [h0, h1, h2, h3, h4].map(v => v.toString(16).padStart(8, '0')).join('');
}

let _crashLast = '', _crashCount = 0, _crashAt = 0;
function logCrash(msg) {
  try {
    const now = performance.now();
    // 相同错误只记录一次并计数，避免持续报错时反复同步写 localStorage 拖慢界面
    if (msg === _crashLast) { _crashCount++; if (now - _crashAt < 1500) return; }
    else { _crashLast = msg; _crashCount = 1; }
    _crashAt = now;
    const prev = localStorage.getItem('crashlog') || '';
    const tag = _crashCount > 1 ? ' (×' + _crashCount + ')' : '';
    localStorage.setItem('crashlog', (prev + '\n[' + new Date().toLocaleTimeString() + '] ' + msg + tag).slice(-800));
  } catch (e) {}
}
window.addEventListener('error', e => {
  // "Script error." 是跨域脚本(AudioWorklet blob)抛错被浏览器遮蔽后的无信息噪声，
  // 拿不到堆栈、也不是模拟器本身的故障（音频已有降级），静默忽略，不吓用户、不污染日志。
  const raw = String(e.message || e.error || '');
  if (/^\s*Script error\.?\s*$/i.test(raw)) return;
  const m = 'JS: ' + raw + ' @' + (e.lineno || '');
  logCrash(m); toast(m);
});
window.addEventListener('unhandledrejection', e => {
  const m = 'Promise: ' + (e.reason && (e.reason.message || e.reason));
  logCrash(m); toast(m);
});
function showCrashLog() {
  const t = localStorage.getItem('crashlog');
  // 诊断框只在明确需要时出现；用户主动关掉后记住，不再反复弹出遮挡界面
  if (!t || localStorage.getItem('crashHide') === '1') return;
  const d = document.createElement('div');
  d.id = 'crashBox';
  d.style.cssText = 'position:fixed;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));left:auto;max-width:min(340px,86vw);background:#2a1020ee;color:#ffd7e2;padding:9px 34px 9px 11px;border:1px solid #ff6b9d66;border-radius:10px;font-size:10px;z-index:99;white-space:pre-wrap;max-height:24vh;overflow:auto;box-shadow:0 6px 24px #0008;backdrop-filter:none';
  const mem = localStorage.getItem('memlog');
  const body = document.createElement('div');
  body.textContent = '上次运行记录:\n' + t + (mem ? '\nJS 堆采样(MB): ' + mem : '');
  d.appendChild(body);
  const x = document.createElement('button');
  x.textContent = '×';
  x.setAttribute('aria-label', '关闭诊断记录');
  x.style.cssText = 'position:absolute;right:6px;top:5px;width:22px;height:22px;line-height:20px;padding:0;border-radius:50%;border:1px solid #ff6b9d88;background:#3a1526;color:#ffd7e2;font-size:15px;font-weight:700;cursor:pointer';
  x.onclick = e => { e.stopPropagation(); localStorage.removeItem('crashlog'); localStorage.setItem('crashHide', '1'); d.remove(); };
  d.appendChild(x);
  document.body.appendChild(d);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (running) autoSave(true); running = false; audio && audio.suspend(); saveBattery(); }
  else if (!document.hidden && running) { audio && audio.resume(); }
  else if ($('play').style.display === 'flex' && wasm) {
    startLoop();
  }
});
window.addEventListener('beforeunload', () => { autoSave(true); saveBattery(); });
addEventListener('resize', () => setTimeout(resize, 60));
setInterval(() => { if (running) saveBattery(); }, 30000);
setInterval(() => { autoSave(true); }, 90000);
window.addEventListener('pagehide', () => { if (running) { autoSave(true); saveBattery(); } });
window.addEventListener('blur', () => { if (running) autoSave(true); });
setInterval(() => {
  try {
    if (!performance.memory) return;
    const mb = (performance.memory.usedJSHeapSize / 1048576).toFixed(0);
    const prev = localStorage.getItem('memlog') || '';
    const list = prev ? prev.split(',').slice(-7) : [];
    list.push(mb);
    localStorage.setItem('memlog', list.join(','));
  } catch (e) {}
}, 10000);

// 尽早初始化 GPU 增强引擎；失败会被自动降级，不影响核心运行
try { initGL(); } catch (e) { GL.lastErr = String(e); }
const glCanvasEl = $('glScreen');
if (glCanvasEl) {
  glCanvasEl.addEventListener('webglcontextlost', e => {
    e.preventDefault(); GL.ok = false; GL.gl = null;
    glCanvasEl.style.display = 'none'; cv.style.display = 'block';
    toast('GPU 增强已暂停（上下文丢失），已切回基础渲染');
  });
  glCanvasEl.addEventListener('webglcontextrestored', () => {
    GL.ok = false; GL.failCount = 0; GL.outW = GL.outH = 0;
    if (initGL()) { toast('GPU 增强已恢复'); resize(); }
  });
}

applyPadVisibility();                         // 触屏按键可见性：启动时应用保存的显示模式与透明度
initHome();                                   // 统计：绑定看板首页 / 底部导航 / 目标编辑
initCore().then(refreshLib).then(() => setTimeout(showCrashLog, 300)).catch(err => toast('核心加载失败: ' + err));
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
