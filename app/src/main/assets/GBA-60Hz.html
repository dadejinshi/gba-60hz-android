function b64(s) { const bin = atob(s), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
async function initCore() {
  const { instance } = await WebAssembly.instantiate(b64(WASM_B64), {});
  wasm = instance.exports; mem = wasm.memory;
}

async function loadRom(bytes, name, id, noCache) {
  if (!wasm) await initCore();
  const ptr = wasm.gba_alloc(bytes.length);
  new Uint8Array(mem.buffer, ptr, bytes.length).set(bytes);
  wasm.gba_reset();
  rwClear();
  romId = id; romName = name; imgData = null; imgBuffer = null;
  GL.texBuf = null; GL.fbPtr = -1; glLastGood = false; glBlackRun = 0;
  audioRetry = 0; wasm.gba_audio_reset(); audio && audio.reset();
  romTitleText = romTitle(bytes);
  statsNoteOpen(id, name);                  // 统计：登记展示名（计时只由 statsTick 负责）
  await loadCheats();
  localStorage.setItem('lastRom', id);
  const sram = await idbGet('sram:' + id);
  if (sram && sram.byteLength === wasm.gba_save_len()) {
    new Uint8Array(mem.buffer, wasm.gba_save_ptr(), sram.byteLength).set(new Uint8Array(sram));
  }
  // 内置游戏 ROM 随页面分发，无需再存一份到数据库（省 33MB 内存/配额）
  if (!noCache) await idbPut('meta:' + id, { name, size: bytes.length, at: Date.now(), title: romTitle(bytes), bytes });
  $('lib').style.display = 'none';
  $('play').style.display = 'flex';
  document.body.classList.add('inGame');
  // 进入游戏时也同步一次：物理已横屏则确保没有残留的 rot90
  syncRotation();
  $('btnMenu').style.display = 'grid';
  $('btnFull').style.display = 'grid';
  $('btnRotate').style.display = 'grid';
  layoutPad();
  watchStage();
  wirePinch();
  requestAnimationFrame(() => { requestAnimationFrame(() => { placePad(); resize(); }); });
  setTimeout(resize, 300);
  setTimeout(resize, 900);
  loopActive = false;
  acc = 0;
  if (!startedAt) startedAt = performance.now();
  startLoop();
  scheduleThumb();                          // 统计：运行后抓一帧缩略图（失败静默）
}

function romTitle(b) {
  let s = '';
  for (let i = 0xA0; i < 0xAC && i < b.length; i++) {
    const c = b[i]; if (!c) break; if (c >= 32 && c < 127) s += String.fromCharCode(c);
  }
  return s.trim();
}

/* ================= WebGL 图像+视频增强引擎 =================
 * 一条 GPU 管线同时完成：xBR 风格边缘感知放大 + 自适应锐化(CAS) +
 * 亮边/暗边去色带 + 可选扫描线/圆角遮罩。纹理每帧从 wasm 帧缓冲零拷贝上传，
 * 全程在 GPU 逐像素计算，因此静态图像与动态视频画面都能实时增强。
 * 任何一步失败都会自动降级到原有的 2D 渲染路径（draw() 中判断 useGL）。
 */
const GL = {
  ok: false, gl: null, prog: null, tex: null, fb: null,
  texW: 0, texH: 0, texBuf: null, u: {}, aPos: 0,
  outW: 0, outH: 0, lastErr: '', failCount: 0, fbPtr: -1
};

const GL_VS = `
attribute vec2 aPos;
varying vec2 vUv;
void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }
`;

// 片元着色器：先做边缘感知重建，再做自适应锐化，最后叠加扫描线/遮罩。
// uMode: 0=清晰(CAS) 1=xBR超清 2=CRT复古
const GL_FS = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2  uTexel;       // 1/240, 1/160
uniform vec2  uOut;         // 输出物理像素尺寸
uniform float uSharp;       // 锐化强度 0..1
uniform int   uMode;        // 0 clear 1 xbr 2 crt
uniform int   uScan;        // 扫描线开关

vec3 samp(vec2 uv){ return texture2D(uTex, clamp(uv, vec2(0.0), vec2(1.0))).rgb; }
float luma(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }

// 取源像素格点上的颜色（像素中心对齐）
vec3 px(vec2 p){ return samp((floor(p) + 0.5) * uTexel); }

void main(){
  // 输出像素 -> 源像素连续坐标。
  // 注意：texImage2D 从数组上传时数据首行(GBA 屏幕顶部)落在纹理 t=0，
  // 而屏幕顶部的 vUv.y=1，故需翻转 Y，否则整个画面上下颠倒。
  vec2 src = vec2(vUv.x, 1.0 - vUv.y) * vec2(240.0, 160.0);
  vec2 cell = floor(src);
  vec2 f = fract(src);

  // ---- 3x3 邻域 ----
  vec3 C = px(cell);
  vec3 N = px(cell + vec2( 0.0,-1.0));
  vec3 S = px(cell + vec2( 0.0, 1.0));
  vec3 W = px(cell + vec2(-1.0, 0.0));
  vec3 E = px(cell + vec2( 1.0, 0.0));
  vec3 NW= px(cell + vec2(-1.0,-1.0));
  vec3 NE= px(cell + vec2( 1.0,-1.0));
  vec3 SW= px(cell + vec2(-1.0, 1.0));
  vec3 SE= px(cell + vec2( 1.0, 1.0));

  vec3 base = C;

  if (uMode >= 1) {
    // ---- xBR 风格边缘感知重建：在斜线/边缘处向匹配的一侧插值，
    //      平坦区域保持原像素，避免传统双线性的整体发糊 ----
    float lC=luma(C), lN=luma(N), lS=luma(S), lW=luma(W), lE=luma(E);
    float lNW=luma(NW), lNE=luma(NE), lSW=luma(SW), lSE=luma(SE);
    // 中心与四邻的色差（越大越可能是边缘）
    float dN=abs(lC-lN), dS=abs(lC-lS), dW=abs(lC-lW), dE=abs(lC-lE);
    float edge = max(max(dN,dS), max(dW,dE)) * 3.2;
    edge = clamp(edge, 0.0, 1.0);

    // 双线性插值作为平滑基底
    vec2 uvC = (cell + 0.5) * uTexel;
    vec3 bl = mix(mix(C, E, f.x), mix(S, SE, f.x), f.y);

    // 斜线判定：若对角与中心接近而正交邻居差异大，则沿对角方向重建
    vec3 outc = bl;
    // 上边缘：中心与上相近、左右差异大 -> 沿水平方向平滑
    if (lC > lN + 0.06 && abs(lNW-lNE) < 0.12) outc = mix(outc, mix(W, C, f.x), 0.5*f.y);
    if (lC > lS + 0.06 && abs(lSW-lSE) < 0.12) outc = mix(outc, mix(W, C, f.x), 0.5*(1.0-f.y));
    if (lC > lW + 0.06 && abs(lN-lS) < 0.12) outc = mix(outc, mix(N, C, f.y), 0.5*f.x);
    if (lC > lE + 0.06 && abs(lN-lS) < 0.12) outc = mix(outc, mix(N, C, f.y), 0.5*(1.0-f.x));

    base = mix(C, outc, edge * 0.85 + 0.15);
  }

  // ---- 自适应锐化 (CAS 简化)：只在有局部对比处增强，平坦区不动，抑制光晕 ----
  vec3 a = N, b = S, c = W, d = E;
  float mn = min(luma(C), min(min(luma(a),luma(b)), min(luma(c),luma(d))));
  float mx = max(luma(C), max(max(luma(a),luma(b)), max(luma(c),luma(d))));
  float contrast = max(mx, 0.0001);
  float amount = min(mn, 1.0 - contrast) / contrast;
  amount = clamp(amount, -1.0, 1.0) * uSharp;
  vec3 blur4 = (a + b + c + d) * 0.25;
  vec3 col = base + (base - blur4) * amount;

  // ---- CRT 复古：轻微暗角 + 圆角遮罩 ----
  if (uMode == 2) {
    vec2 q = vUv * 2.0 - 1.0;
    float vig = 1.0 - 0.28 * dot(q, q) * 0.5;
    col *= clamp(vig, 0.0, 1.0);
  }

  // ---- 扫描线：按输出物理像素对齐，越细越不糊 ----
  if (uScan == 1) {
    float line = mod(gl_FragCoord.y, 3.0);
    float m = (line < 1.0) ? 0.82 : 1.0;
    col *= m;
  }

  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
`;

function glShader(type, src) {
  const s = GL.gl.createShader(type);
  GL.gl.shaderSource(s, src); GL.gl.compileShader(s);
  if (!GL.gl.getShaderParameter(s, GL.gl.COMPILE_STATUS)) {
    GL.lastErr = 'shader: ' + GL.gl.getShaderInfoLog(s); return null;
  }
  return s;
}
function initGL() {
  if (GL.ok || GL.failCount > 2) return GL.ok;
  try {
    const c = $('glScreen');
    const gl = c.getContext('webgl', { alpha:false, antialias:false, depth:false,
      preserveDrawingBuffer:true, premultipliedAlpha:false }) ||
      c.getContext('experimental-webgl', { alpha:false, antialias:false, depth:false,
      preserveDrawingBuffer:true });
    if (!gl) { GL.lastErr = 'no webgl context'; GL.failCount++; return false; }
    GL.gl = gl;
    const vs = glShader(gl.VERTEX_SHADER, GL_VS), fs = glShader(gl.FRAGMENT_SHADER, GL_FS);
    if (!vs || !fs) { GL.failCount++; return false; }
    const p = gl.createProgram();
    gl.attachShader(p, vs); gl.attachShader(p, fs); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      GL.lastErr = 'link: ' + gl.getProgramInfoLog(p); GL.failCount++; return false;
    }
    GL.prog = p; gl.useProgram(p);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    GL.aPos = gl.getAttribLocation(p, 'aPos');
    gl.enableVertexAttribArray(GL.aPos);
    gl.vertexAttribPointer(GL.aPos, 2, gl.FLOAT, false, 0, 0);
    GL.u = {
      tex: gl.getUniformLocation(p, 'uTex'), texel: gl.getUniformLocation(p, 'uTexel'),
      out: gl.getUniformLocation(p, 'uOut'), sharp: gl.getUniformLocation(p, 'uSharp'),
      mode: gl.getUniformLocation(p, 'uMode'), scan: gl.getUniformLocation(p, 'uScan')
    };
    GL.tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, GL.tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.uniform1i(GL.u.tex, 0);
    GL.ok = true; GL.lastErr = '';
    return true;
  } catch (e) { GL.lastErr = String(e); GL.failCount++; return false; }
}

function isGLMode() {
  return pixelMode === 'enhance' || pixelMode === 'xbr' || pixelMode === 'crt';
}
function useGL() {
  // 画质引擎自身完成平滑重建，无需依赖 screenMode 的平滑路径
  return GL.ok && isGLMode();
}

// 每帧：从 wasm 帧缓冲零拷贝上传纹理，GPU 增强后输出。
let glBlackRun = 0, glLastGood = false;
function drawGL() {
  const gl = GL.gl, c = $('glScreen');
  if (!gl || !GL.ok) return false;
  try {
    if (GL.outW !== c.width || GL.outH !== c.height) {
      GL.outW = c.width; GL.outH = c.height;
      gl.viewport(0, 0, c.width, c.height);
      gl.uniform2f(GL.u.out, c.width, c.height);
    }
    const fbBytes = W * H * 4;
    const ptr = wasm.gba_fb_ptr();
    if (!GL.texBuf || GL.texBuf.buffer !== mem.buffer || GL.fbPtr !== ptr) {
      GL.texBuf = new Uint8Array(mem.buffer, ptr, fbBytes);
      GL.fbPtr = ptr;
    }
    // 黑帧沿用上一帧，避免转场黑闪（纹理不清空即可）
    // 抽样检测即可判定黑帧，步长 512 把每帧开销从约 1000 次降到约 300 次
    const src = GL.texBuf;
    let black = true;
    for (let i = 0; i < src.length; i += 512) {
      if (src[i] || src[i+1] || src[i+2]) { black = false; break; }
    }
    if (!(black && antiFlash && glLastGood && glBlackRun < 3)) {
      gl.bindTexture(gl.TEXTURE_2D, GL.tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, src);
      if (!black) { glLastGood = true; glBlackRun = 0; }
    } else { glBlackRun++; }

    gl.useProgram(GL.prog);
    gl.uniform2f(GL.u.texel, 1 / W, 1 / H);
    const mode = pixelMode === 'enhance' ? 0 : pixelMode === 'xbr' ? 1 : 2;
    gl.uniform1i(GL.u.mode, mode);
    gl.uniform1f(GL.u.sharp, (glSharp / 100) * 0.55);
    const scanOn = glScanline && (mode === 1 || mode === 2) ? 1 : 0;
    gl.uniform1i(GL.u.scan, scanOn);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    return true;
  } catch (e) {
    GL.lastErr = String(e); GL.failCount++; GL.ok = false;
    return false;
  }
}

/* ================= rendering ================= */
function pinchDist(t) {
  const dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
  return Math.hypot(dx, dy) || 1;
}
let pinchStart = 0;
function wirePinch() {
  const el = $('stageWrap');
  if (!el || el.dataset.pinch) return;
  el.dataset.pinch = '1';
  el.addEventListener('touchstart', e => { if (e.touches.length === 2) pinchStart = pinchDist(e.touches); }, { passive: true });
  el.addEventListener('touchmove', e => {
    if (e.touches.length !== 2 || !pinchStart) return;
    const d = pinchDist(e.touches);
    zoom = Math.min(3, Math.max(0.5, zoom * (d / pinchStart)));
    pinchStart = d;
    localStorage.setItem('zoom', zoom);
    resize();
  }, { passive: true });
  el.addEventListener('touchend', () => { pinchStart = 0; });
  el.addEventListener('touchcancel', () => { pinchStart = 0; });
}

function applyOverlay(scale) {
  const ov = $('overlay');
  const glc = $('glScreen');
  if (!ov) return;
  const a = Math.min(1, Math.max(0, overlayStrength / 100));
  const S = v => 'rgba(0,0,0,' + (v * a).toFixed(3) + ')';
  const filt = `brightness(${colorAdj.b}%) contrast(${colorAdj.c}%) saturate(${colorAdj.s}%)`;
  cv.style.filter = filt;
  if (glc) glc.style.filter = filt;
  if (overlay === 'none' || a <= 0.01) { ov.style.display = 'none'; return; }
  ov.style.display = 'block';
  ov.style.width = cv.style.width;
  ov.style.height = cv.style.height;
  let bi = 'none';
  if (overlay === 'scan') {
    bi = `repeating-linear-gradient(to bottom, ${S(0.55)} 0, ${S(0.55)} 1px, transparent 1px, transparent 3px)`;
  } else if (overlay === 'dot') {
    bi = `repeating-linear-gradient(to right, ${S(0.5)} 0, ${S(0.5)} 1px, transparent 1px, transparent 3px)`;
  } else if (overlay === 'vignette') {
    bi = `radial-gradient(ellipse at center, transparent 50%, ${S(0.85)} 100%)`;
  } else if (overlay === 'crt') {
    bi = `repeating-linear-gradient(to bottom, ${S(0.45)} 0, ${S(0.45)} 1px, transparent 1px, transparent 3px),` +
         `radial-gradient(ellipse at center, transparent 45%, ${S(0.9)} 100%)`;
  } else if (overlay === 'lcd') {
    const px = Math.max(2, Math.round(scale || 2));
    bi = `repeating-linear-gradient(to right, rgba(0,0,0,${(0.30 * a).toFixed(3)}) 0 1px, transparent 1px ${px}px),` +
         `repeating-linear-gradient(to bottom, rgba(0,0,0,${(0.30 * a).toFixed(3)}) 0 1px, transparent 1px ${px}px)`;
  }
  ov.style.backgroundImage = bi;
}

let stageObserver = null;
function watchStage() {
  if (stageObserver || !window.ResizeObserver) return;
  stageObserver = new ResizeObserver(() => { resize(); });
  stageObserver.observe($('stageWrap'));
}

/**
 * Integer scaling is done in *device* pixels: one emulated pixel becomes exactly
 * N screen pixels, so the picture is never resampled by the compositor - that is
 * what kept the edges wobbly before.
 */
function resize() {
  const wrap = $('stageWrap');
  const aw = wrap.clientWidth, ah = wrap.clientHeight;
  if (!aw || !ah) return;
  const dpr = window.devicePixelRatio || 1;
  const awDev = aw * dpr, ahDev = ah * dpr;
  let s;
  // GL 增强档需要整数倍物理像素，让像素网格与着色器采样/扫描线精确对齐
  const soft = !isGLMode() && (screenMode === 'smooth' || pixelMode === 'smooth');

  if (soft) {
    s = Math.min(aw / W, ah / H) * zoom;
    const cw = Math.round(W * s * dpr), ch = Math.round(H * s * dpr);
    if (cv.width !== cw || cv.height !== ch) { cv.width = cw; cv.height = ch; }
    cv.style.width = (W * s) + 'px';
    cv.style.height = (H * s) + 'px';
    cv.style.imageRendering = 'auto';
  } else {
    const unit = pixelMode === 'enhance' ? 2 : 1;
    const f = Math.max(1, Math.floor(Math.min(awDev / (W * unit), ahDev / (H * unit)) * zoom));
    const cw = W * unit * f, ch = H * unit * f;
    if (cv.width !== cw || cv.height !== ch) { cv.width = cw; cv.height = ch; }
    cv.style.width = (cw / dpr) + 'px';
    cv.style.height = (ch / dpr) + 'px';
    cv.style.imageRendering = 'pixelated';
    s = (cw / dpr) / W;
  }

  // WebGL 增强层与 2D 画布共用同一尺寸；按当前模式决定谁可见。
  const glc = $('glScreen');
  if (glc) {
    if (glc.width !== cv.width || glc.height !== cv.height) {
      glc.width = cv.width; glc.height = cv.height;
      GL.outW = GL.outH = 0; // 强制下帧重设 viewport
    }
    glc.style.width = cv.style.width;
    glc.style.height = cv.style.height;
    const showGL = useGL();
    glc.style.display = showGL ? 'block' : 'none';
    cv.style.display = showGL ? 'none' : 'block';
  }

  applyOverlay(s);
  grid.style.display = filter === 'lcd' ? 'block' : 'none';
  if (filter === 'lcd') {
    grid.style.width = cv.style.width;
    grid.style.height = cv.style.height;
    grid.style.left = '50%';
    grid.style.top = '50%';
    grid.style.transform = 'translate(-50%,-50%)';
    grid.style.backgroundSize = s + 'px ' + s + 'px';
  }
}

/* ---------------- frame presentation ---------------- */
let imgData = null, imgBuffer = null;
let prevPixels = new Uint8ClampedArray(W * H * 4);

function mostlyBlack(data) {
  for (let i = 0; i < data.length; i += 4 * 37) {
    if (data[i] | data[i + 1] | data[i + 2]) return false;
  }
  return true;
}
function mostlyBlackArr(arr) {
  for (let i = 0; i < arr.length; i += 37) {
    if (arr[i] & 0x00FFFFFF) return false;
  }
  return true;
}
function newEnhBuf() {
  const img = new ImageData(W * 2, H * 2);
  return { img, arr: new Uint32Array(img.data.buffer) };
}
function blit(srcCanvas, sw, sh) {
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(srcCanvas, 0, 0, sw, sh, 0, 0, cv.width, cv.height);
}

function drawEnhanced() {
  if (!bufCur) bufCur = newEnhBuf();
  if (!bufLast) bufLast = newEnhBuf();
  const src = new Uint32Array(mem.buffer, wasm.gba_fb_ptr(), W * H);
  const out = bufCur.arr;
  const W2 = W * 2;
  for (let y = 0; y < H; y++) {
    const up = y > 0 ? y - 1 : 0, dn = y < H - 1 ? y + 1 : H - 1;
    const rowU = up * W, rowD = dn * W, rowC = y * W;
    const o0 = (y * 2) * W2, o1 = o0 + W2;
    for (let x = 0; x < W; x++) {
      const lf = x > 0 ? x - 1 : 0, rt = x < W - 1 ? x + 1 : W - 1;
      const E = src[rowC + x];
      const A = src[rowU + x], B = src[rowC + rt], C = src[rowC + lf], D = src[rowD + x];
      let e0 = E, e1 = E, e2 = E, e3 = E;
      if (C === A && C !== D && A !== B) e0 = A;
      if (A === B && A !== C && B !== D) e1 = B;
      if (D === C && D !== B && C !== A) e2 = C;
      if (B === D && B !== A && D !== C) e3 = D;
      const o = o0 + x * 2;
      out[o] = e0; out[o + 1] = e1; out[o1 + x * 2] = e2; out[o1 + x * 2 + 1] = e3;
    }
  }
  const black = mostlyBlackArr(out);
  if (black && antiFlash && lastValidEnh && blackRun < 3) {
    blackRun++;
  } else if (!black) {
    const t = bufLast; bufLast = bufCur; bufCur = t;
    lastValidEnh = true;
    blackRun = 0;
  }
  if (!enhCanvas) {
    enhCanvas = document.createElement('canvas');
    enhCanvas.width = W2; enhCanvas.height = H * 2;
    enhCtx = enhCanvas.getContext('2d', { alpha: false });
  }
  enhCtx.putImageData((black && antiFlash && lastValidEnh) ? bufLast.img : bufCur.img, 0, 0);
  blit(enhCanvas, W2, H * 2);
}

function draw() {
  if (!wasm) return;
  // WebGL 引擎优先：静态图像与动态视频画面都在 GPU 上实时增强
  if (useGL()) {
    if (drawGL()) return;
    // GL 本帧失败 -> 回退并隐藏增强层
    const glc = $('glScreen'); if (glc) glc.style.display = 'none';
    cv.style.display = 'block';
  }
  if (pixelMode === 'enhance' && screenMode !== 'smooth') { drawEnhanced(); return; }
  if (!imgData || imgBuffer !== mem.buffer) {
    imgBuffer = mem.buffer;
    imgData = new ImageData(new Uint8ClampedArray(imgBuffer, wasm.gba_fb_ptr(), W * H * 4), W, H);
    prevValid = false;
  }
  const soft = pixelMode === 'smooth' || screenMode === 'smooth';
  if (!offCanvas) {
    offCanvas = document.createElement('canvas');
    offCanvas.width = W; offCanvas.height = H;
    offCtx2 = offCanvas.getContext('2d', { alpha: false });
  }
  if (soft) {
    offCtx2.putImageData(imgData, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(offCanvas, 0, 0, cv.width, cv.height);
    return;
  }
  const data = imgData.data;
  if (mostlyBlack(data) && antiFlash && prevValid && blackRun < 3) {
    blackRun++;
    offCtx2.putImageData(prevImg, 0, 0);
  } else {
    if (!mostlyBlack(data)) {
      prevPixels.set(data);
      prevValid = true;
      blackRun = 0;
    }
    offCtx2.putImageData(imgData, 0, 0);
  }
  blit(offCanvas, W, H);
}

let lastErr = '';
function startLoop() {
  running = true;
  audioStart();   // 用户手势里激活音频（幂等；失败静默降级为无声）
  if (loopActive) return;
  loopActive = true;
  lastTime = performance.now();
  fpsMark = lastTime;
  emuFrames = 0;
  requestAnimationFrame(loop);
}
function loop(now) {
  if (!running) { loopActive = false; return; }
  try {
    pollGamepad();                                   // 手柄轮询（每帧一次）
    // 连发：按住 A/B 时按频率脉冲，需持续重算 mask（判断用物理按下 physMask）
    if ((turboCfg.A.on && (physMask & KEYS.A)) || (turboCfg.B.on && (physMask & KEYS.B))) recompute();
    const dt = Math.min(now - lastTime, 60);
    lastTime = now;
    const spd = ffHeld ? 4 : speed;                   // 按住加速键 → 4×
    acc += dt * spd;
    let n = 0;
    // Never try to "catch up": a heavy transition frame used to queue more
    // frames, which is what made battles and menus stutter.
    const max = (spd > 1 || rwActive) ? 3 : 1;
    if (rwActive) {
      // 回溯：按固定节奏回退快照，不推进模拟
      rwTick++;
      if (rwTick % 2 === 0) {
        if (!rwStep()) { rwStop(); toast('已回到最早记录'); }
      }
      draw(); lastDrawAt = now;
      acc = 0;
    } else {
      while (acc >= PERIOD && n < max) {
        wasm.gba_frame(); audioPushFrame(); acc -= PERIOD; n++; emuFrames++;
        if (rewindOn && ++rwFrameAcc >= RW_EVERY) { rwFrameAcc = 0; rwSnapshot(); }
      }
      if (acc > PERIOD * 2) acc = 0;
      if (n) {
        const minGap = capFps > 0 ? 1000 / capFps : 0;
        if (now - lastDrawAt >= minGap) { draw(); lastDrawAt = now; }
      }
    }
  } catch (e) { lastErr = String(e); }
  const span = now - fpsMark;
  if (span >= 1000) {
    fps = emuFrames * 1000 / span; emuFrames = 0; fpsMark = now;
    fpsEl.textContent = fps.toFixed(0) + ' fps';
    // 首次音频启动偶发失败（尤其 file://）：用户已交互，低频重试几次。
    if (!audioOn && audioRetry < 5 && !document.hidden) { audioRetry++; audioStart(); }
    const up = Math.floor((performance.now() - startedAt) / 1000);
    const mm = Math.floor(up / 60), ss = up % 60;
    hud.textContent = (speed > 1 ? speed + '×  ' : '') + fps.toFixed(1) + ' fps · ' +
      mm + ':' + String(ss).padStart(2, '0') + (lastErr ? '  ⚠ ' + lastErr.slice(0, 40) : '');
  }
  requestAnimationFrame(loop);
}

/* ================= pad ================= */
const PAD_KEY = 'padLayout';
const DEF_PAD = { scale: 1, off: { portrait: {}, landscape: {} } };
let padCfg = (() => {
  try { const c = JSON.parse(localStorage.getItem(PAD_KEY) || 'null'); if (c && c.off) return c; } catch (e) {}
  return JSON.parse(JSON.stringify(DEF_PAD));
})();
function savePadCfg() { try { localStorage.setItem(PAD_KEY, JSON.stringify(padCfg)); } catch (e) {} }
function orientName() {
  if (document.body.classList.contains('rot90')) return 'landscape';
  return matchMedia('(orientation:landscape)').matches ? 'landscape' : 'portrait';
}
function keyOff(name) {
  const o = padCfg.off[orientName()] || (padCfg.off[orientName()] = {});
  return o[name] || { x: 0, y: 0 };
}

let editMode = false;
function setEditMode(on) {
  editMode = on;
  document.body.classList.toggle('editing', on);
  const bar = $('editBar');
  if (bar) bar.style.display = on ? 'flex' : 'none';
  if (on) placePad();
  else { savePadCfg(); toast('布局已保存'); }
}

function keyEl(label, bits, cls, arrow, name) {
  const el = document.createElement('div');
  el.className = 'k ' + (cls || '');
  el.dataset.bits = bits;
  el.dataset.key = name;
  if (arrow) { const s = document.createElement('span'); s.className = arrow; el.appendChild(s); }
  else el.textContent = label;
  // Long-press-free drag editing: only active in edit mode.
  el.addEventListener('pointerdown', e => {
    if (!editMode) return;
    e.preventDefault();
    e.stopPropagation();
    const padW = pad.clientWidth || 1, padH = pad.clientHeight || 1;
    const sx = e.clientX, sy = e.clientY;
    const base = keyOff(name);
    const move = ev => {
      const o = padCfg.off[orientName()] || (padCfg.off[orientName()] = {});
      o[name] = { x: base.x + (ev.clientX - sx) / padW, y: base.y + (ev.clientY - sy) / padH };
      placePad();
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      savePadCfg();
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  });
  return el;
}

function layoutPad() {
  if (pad.dataset.done) return;
  pad.dataset.done = '1';
  const dpad = document.createElement('div');
  dpad.id = 'dpad';
  dpad.style.position = 'absolute';
  const up = keyEl('', KEYS.UP, '', 'a-up', 'UP'),
        down = keyEl('', KEYS.DOWN, '', 'a-down', 'DOWN'),
        left = keyEl('', KEYS.LEFT, '', 'a-left', 'LEFT'),
        right = keyEl('', KEYS.RIGHT, '', 'a-right', 'RIGHT');
  [up, down, left, right].forEach(k => k.style.position = 'absolute');
  [up, down, left, right].forEach(k => dpad.appendChild(k));

  const A = keyEl('A', KEYS.A, 'round', null, 'A'); A.id = 'kA';
  const B = keyEl('B', KEYS.B, 'round', null, 'B'); B.id = 'kB';
  const L = keyEl('L', KEYS.L, 'small', null, 'L'); L.id = 'kL';
  const R = keyEl('R', KEYS.R, 'small', null, 'R'); R.id = 'kR';
  const SEL = keyEl('SELECT', KEYS.SELECT, 'small', null, 'SELECT'); SEL.id = 'kSEL';
  const STA = keyEl('START', KEYS.START, 'small', null, 'START'); STA.id = 'kSTA';
  // 摇杆底座 + 摇杆头：与 dpad 同位置，靠 body[data-padmode] 切换显隐
  const stickBase = document.createElement('div'); stickBase.id = 'stickBase';
  const stickKnob = document.createElement('div'); stickKnob.id = 'stickKnob';
  stickBase.appendChild(stickKnob);
  [dpad, A, B, L, R, SEL, STA, stickBase].forEach(el => pad.appendChild(el));

  placePad();
  if (window.ResizeObserver) new ResizeObserver(() => placePad()).observe(pad);
  addEventListener('resize', () => { setTimeout(placePad, 60); setTimeout(resize, 80); });
  matchMedia('(orientation:landscape)').addEventListener('change', () => {
    syncRotation();
    setTimeout(placePad, 90); setTimeout(resize, 120);
  });
  // 部分浏览器在物理旋转时只触发 orientationchange，不触发 matchMedia change
  addEventListener('orientationchange', () => {
    syncRotation();
    setTimeout(placePad, 120); setTimeout(resize, 200);
  });
}

function placePad() {
  // 设置页在非游戏态也会调整 padCfg；此时虚拟按键尚未生成，直接跳过布局即可
  if (!pad || !$('dpad')) return;
  const pw = pad.clientWidth || window.innerWidth || 1;
  const ph = pad.clientHeight || Math.round((window.innerHeight || 600) * 0.33) || 1;
  const land = orientName() === 'landscape';
  // Landscape keys float over the video, so they must be sized from the short edge.
  const base = land ? Math.min(ph * 0.60, pw * 0.16) : Math.min(pw * 0.30, ph * 0.74);
  const big = Math.max(48, base * (padCfg.scale || 1));
  const at = (name, defX, defY) => {
    const o = keyOff(name);
    return { x: defX + (o.x || 0), y: defY + (o.y || 0) };
  };
  // Percentages + translate keep every key anchored to the real pad box even if
  // it is resized after we place it (rotation, fullscreen, browser chrome).
  const put = (el, cx, cy, ww, hh) => {
    el.style.left = (cx * 100) + '%';
    el.style.top = (cy * 100) + '%';
    el.style.transform = 'translate(-50%,-50%)';
    el.style.width = ww + 'px';
    el.style.height = hh + 'px';
  };

  const dpad = $('dpad');
  const c = at('DPAD', land ? 0.12 : 0.16, land ? 0.58 : 0.52);
  put(dpad, c.x, c.y, big, big);
  // 摇杆底座与 dpad 同尺寸同位置（stickKnob 用百分比居中，自动适配缩放）
  const sb = $('stickBase'); if (sb) put(sb, c.x, c.y, big, big);

  const half = big / 2;
  // 分体式十字键：四个独立方块，中心留空隙，避免连体误触
  const key = big * 0.38, off = big * 0.30;
  const dp = dpad.children;
  const putRel = (el, cx, cy) => {
    el.style.left = (cx - key / 2) + 'px'; el.style.top = (cy - key / 2) + 'px';
    el.style.width = key + 'px'; el.style.height = key + 'px';
  };
  putRel(dp[0], half, half - off); // UP
  putRel(dp[1], half, half + off); // DOWN
  putRel(dp[2], half - off, half); // LEFT
  putRel(dp[3], half + off, half); // RIGHT

  const rr = big * 0.26;
  const a = at('A', land ? 0.88 : 0.83, land ? 0.42 : 0.36);
  const b = at('B', land ? 0.77 : 0.69, land ? 0.66 : 0.58);
  put($('kA'), a.x, a.y, rr * 2, rr * 2);
  put($('kB'), b.x, b.y, rr * 2, rr * 2);

  const lw = big * 0.62, lh = big * 0.22;
  const l = at('L', land ? 0.12 : 0.12, land ? 0.12 : 0.09);
  const r = at('R', land ? 0.88 : 0.88, land ? 0.12 : 0.09);
  put($('kL'), l.x, l.y, lw, lh);
  put($('kR'), r.x, r.y, lw, lh);

  const sw = big * 0.52, sh = big * 0.18;
  const sel = at('SELECT', land ? 0.40 : 0.36, land ? 0.88 : 0.86);
  const sta = at('START', land ? 0.60 : 0.64, land ? 0.88 : 0.86);
  put($('kSEL'), sel.x, sel.y, sw, sh);
  put($('kSTA'), sta.x, sta.y, sw, sh);
}

const pointerBits = new Map();
function recompute() {
  let phys = gamepadBits;                       // 手柄
  for (const b of pointerBits.values()) phys |= b;   // 触屏 + 键盘
  physMask = phys;
  maybeVibrate(phys);                           // 触感反馈（只在新增按下时震动）
  let m = applyTurbo(phys);                     // 连发
  if (m !== keyMask) {
    keyMask = m;
    if (wasm) wasm.gba_set_keys(m);
  }
}

/** D-pad is treated as one continuous area: dead zone in the middle, 8-way
 *  by angle. No more "finger slipped into the gap and the key dropped". */
function dpadBits(x, y) {
  const el = $('dpad');
  if (!el) return 0;
  const r = el.getBoundingClientRect();
  if (!r.width || !r.height) return 0;
  const dx = (x - (r.left + r.width / 2)) / (r.width / 2);
  const dy = (y - (r.top + r.height / 2)) / (r.height / 2);
  if (Math.hypot(dx, dy) < 0.26) return 0;           // dead zone
  let bits = 0;
  if (Math.abs(dx) > 0.22) bits |= dx < 0 ? KEYS.LEFT : KEYS.RIGHT;
  if (Math.abs(dy) > 0.22) bits |= dy < 0 ? KEYS.UP : KEYS.DOWN;
  return bits;
}

/** 分体式十字键判定：触点落在哪个独立方块就触发该方向；
 *  斜向只需落在两个方块的夹角区（同时命中两块），中心空隙不触发任何方向。 */
function splitDpadBits(x, y) {
  const dp = $('dpad');
  if (!dp) return 0;
  let bits = 0;
  const kids = dp.children;
  for (let i = 0; i < kids.length; i++) {
    const r = kids[i].getBoundingClientRect();
    const m = 6; // 边缘容差：手指压在键边缘也算命中，减少滑落
    if (x >= r.left - m && x <= r.right + m && y >= r.top - m && y <= r.bottom + m)
      bits |= +kids[i].dataset.bits;
  }
  return bits;
}

function computeBits(x, y) {
  let bits = 0;
  const dp = $('dpad');
  if (dp) {
    const r = dp.getBoundingClientRect();
    // generous margin keeps a finger resting on the edge inside the same key
    if (x >= r.left - 12 && x <= r.right + 12 && y >= r.top - 12 && y <= r.bottom + 12) {
      bits |= splitDpadBits(x, y);
    }
  }
  for (const el of pad.querySelectorAll('.k')) {
    if (el.closest('#dpad')) continue;
    const r = el.getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) bits |= +el.dataset.bits;
  }
  return bits;
}

function paint() {
  for (const el of pad.querySelectorAll('.k')) {
    el.classList.toggle('on', (keyMask & +el.dataset.bits) !== 0);
  }
}

/* ---- 八向摇杆：摇杆头跟随触点、松手回中；方向位仍复用 dpadBits 的八向判定 ---- */
let stickPointer = null;
function stickGeom() {
  const base = $('stickBase'); if (!base) return null;
  const r = base.getBoundingClientRect();
  if (!r.width || !r.height) return null;
  return { cx: r.left + r.width / 2, cy: r.top + r.height / 2, r: r.width / 2 };
}
function syncStick(x, y) {
  const g = stickGeom(); if (!g) return;
  let dx = x - g.cx, dy = y - g.cy;
  const max = g.r * 0.46;                       // 摇杆头最大位移（加大，跟随更明显）
  const dist = Math.hypot(dx, dy);
  if (dist > max) { dx = dx / dist * max; dy = dy / dist * max; }
  const knob = $('stickKnob');
  if (knob) {
    knob.classList.add('drag');                 // 拖动零延迟、无阻尼
    knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
  }
}
function resetStick() {
  const knob = $('stickKnob');
  if (knob) {
    knob.classList.remove('drag');              // 恢复过渡，松手顺滑回中
    knob.style.transform = 'translate(-50%,-50%)';
  }
}

pad.addEventListener('pointerdown', e => {
  if (editMode) return;
  e.preventDefault();
  pad.setPointerCapture?.(e.pointerId);
  let bits;
  // 摇杆模式：触点落在摇杆底座内则认领为摇杆指针
  if (padMode === 'stick' && stickPointer === null) {
    const g = stickGeom();
    if (g && Math.hypot(e.clientX - g.cx, e.clientY - g.cy) <= g.r * 1.25) {
      stickPointer = e.pointerId;
      // 关键：摇杆用 dpadBits（相对中心的角度判定，无矩形边界），
      // 不用 computeBits（它有 ±10px 矩形边界，手指划出底座就断向）。
      bits = dpadBits(e.clientX, e.clientY);
      syncStick(e.clientX, e.clientY);
    } else bits = computeBits(e.clientX, e.clientY);
  } else bits = computeBits(e.clientX, e.clientY);
  pointerBits.set(e.pointerId, bits);
  recompute(); paint();
});
pad.addEventListener('pointermove', e => {
  if (editMode || !pointerBits.has(e.pointerId)) return;
  if (padMode === 'stick' && stickPointer === e.pointerId) {
    // 摇杆：只按相对中心的角度判定方向（即使手指滑出底座也持续输出方向），
    // 只有回到中心死区才松开。杜绝"转向时手指稍微划出边界就卡住"的问题。
    pointerBits.set(e.pointerId, dpadBits(e.clientX, e.clientY));
    syncStick(e.clientX, e.clientY);
  } else {
    const b = computeBits(e.clientX, e.clientY);
    // Sticky: only switch when the finger is actually over a key, otherwise keep
    // the previous state so a drifting finger never produces a dropped frame.
    if (b !== 0) pointerBits.set(e.pointerId, b);
  }
  recompute(); paint();
});
const endPtr = e => {
  if (editMode) return;
  pointerBits.delete(e.pointerId);
  if (stickPointer === e.pointerId) { stickPointer = null; resetStick(); }
  recompute(); paint();
};
pad.addEventListener('pointerup', endPtr);
pad.addEventListener('pointercancel', endPtr);
pad.addEventListener('pointerout', e => { if (e.buttons === 0) endPtr(e); });

const keyMap = {ArrowUp:KEYS.UP,ArrowDown:KEYS.DOWN,ArrowLeft:KEYS.LEFT,ArrowRight:KEYS.RIGHT,
  KeyZ:KEYS.A,KeyX:KEYS.B,KeyA:KEYS.L,KeyS:KEYS.R,Enter:KEYS.START,ShiftRight:KEYS.SELECT};
addEventListener('keydown', e => {
  // 快捷键录入学：先捕获按键，不触发游戏动作
  if (capturingHK) {
    e.preventDefault();
    hotkeys[capturingHK] = e.code; capturingHK = null; saveExtras();
    toast('快捷键已设为 ' + e.code);
    if (typeof rerenderSetSub === 'function') rerenderSetSub();
    return;
  }
  const hk = hotkeys || {};
  if (e.code === hk.save)  { e.preventDefault(); if (!e.repeat) quickSlot(1, 'save'); return; }
  if (e.code === hk.load)  { e.preventDefault(); if (!e.repeat) quickSlot(1, 'load'); return; }
  if (e.code === hk.ff)    { e.preventDefault(); ffHeld = true; return; }
  if (e.code === hk.rewind){ e.preventDefault(); if (!e.repeat && running) rwStart(); return; }
  const b = keyMap[e.code];
  if (b) { e.preventDefault(); pointerBits.set('k'+e.code, b); recompute(); paint(); }
});
addEventListener('keyup', e => {
  if (e.code === hotkeys.ff) ffHeld = false;
  if (e.code === hotkeys.rewind) rwStop();
  const b = keyMap[e.code]; if (b) { pointerBits.delete('k'+e.code); recompute(); paint(); }
});

/* ================= states ================= */
async function writeState(slot) {
  const len = wasm.gba_state_save();
  const ptr = wasm.gba_state_ptr();
  await idbPut(`state:${romId}:${slot}`, new Uint8Array(mem.buffer, ptr, len).slice());
  await idbPut(`slotmeta:${romId}:${slot}`, Date.now());
  // 同时抓一张当前画面存档位缩略图；抓帧失败绝不影响存档本身
  try {
    const url = grabFrameThumb();
    if (url) await idbPut(`slotthumb:${romId}:${slot}`, url);
    else await idbDel(`slotthumb:${romId}:${slot}`);   // 抓帧失败则清掉旧图，避免显示错档画面
  } catch (e) {}
  await saveBattery();
}
async function readState(slot) {
  const bytes = await idbGet(`state:${romId}:${slot}`);
  if (!bytes) return false;
  const ptr = wasm.gba_state_ptr();
  new Uint8Array(mem.buffer, ptr, bytes.byteLength).set(new Uint8Array(bytes));
  return wasm.gba_state_load(bytes.byteLength) === 0;
}
async function saveState(slot) {
  if (!wasm || !romId) return;
  try { await writeState(slot); toast('已存到档位 ' + slot); }
  catch (e) { toast('存档失败: ' + e); }
}
async function loadState(slot) {
  try {
    if (!(await idbGet(`state:${romId}:${slot}`))) return toast('档位 ' + slot + ' 是空的');
    const ok = await readState(slot);
    if (ok) rwClear();
    toast(ok ? '已读取档位 ' + slot : '读档失败');
  } catch (e) { toast('读档失败: ' + e); }
}

/** Auto-save: one hidden slot per game, written when leaving or every 45s. */

  try {
    await writeState('auto');
    if (!silent) toast('已自动存档');
  } catch (e) {}
}
async function autoResume() {
  const meta = await idbGet(`slotmeta:${romId}:auto`);
  if (!meta) return;
  const ok = await readState('auto');
  if (ok) rwClear();
  toast(ok ? '已恢复上次进度（自动存档）' : '自动存档读取失败');
}
async function saveBattery() {
  if (!wasm || !romId) return;
  try { await idbPut('sram:' + romId, new Uint8Array(mem.buffer, wasm.gba_save_ptr(), wasm.gba_save_len()).slice()); }
  catch (e) {}
}

/* ================= save files & screenshots ================= */
function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
function baseName() { return (romName || 'game').replace(/\.(gba|bin|agb)$/i, ''); }
function exportSav() {
  if (!wasm || !romId) return;
  const bytes = new Uint8Array(mem.buffer, wasm.gba_save_ptr(), wasm.gba_save_len());
  downloadBlob(new Blob([bytes], { type: 'application/octet-stream' }), baseName() + '.sav');
  toast('已导出 ' + baseName() + '.sav');
}
function importSav(file) {
  if (!wasm || !romId) return;
  file.arrayBuffer().then(buf => {
    const src = new Uint8Array(buf);
    const dst = new Uint8Array(mem.buffer, wasm.gba_save_ptr(), wasm.gba_save_len());
    dst.fill(0xFF);
    dst.set(src.subarray(0, Math.min(src.length, dst.length)));
    saveBattery();
    toast('已导入存档（' + src.length + ' 字节）');
  }).catch(e => toast('导入失败: ' + e));
}
function screenshot() {
  try {
    const src = useGL() && GL.ok ? $('glScreen') : cv;
    src.toBlob(b => downloadBlob(b, baseName() + '-' + Date.now() + '.png'), 'image/png');
    toast('已保存截图');
  } catch (e) { toast('截图失败: ' + e); }
}

/* ================= cheats ================= */
function parseCheat(code) {
  const key = (code || '').trim();
  if (cheatParsed.has(key)) return cheatParsed.get(key);
  const out = [];
  const parts = key.replace(/[^0-9A-Fa-f]/g, ' ').trim().split(/\s+/).filter(Boolean);
  for (let i = 0; i + 1 < parts.length; i += 2) {
    const a = parts[i], v = parts[i + 1];
    if (a.length !== 8) continue;
    const size = v.length >= 8 ? 4 : v.length >= 4 ? 2 : 1;
    let addr = parseInt(a, 16) >>> 0;
    // CodeBreaker/AR codes set bit 28 as a marker; the real address is the low 28 bits.
    if (addr & 0x08000000) addr &= 0x0FFFFFFF;
    out.push({ addr, value: parseInt(v, 16), size });
  }
  cheatParsed.set(key, out);
  return out;
}

function applyCheats() {
  if (!wasm || !cheats.length) return;
  for (const c of cheats) {
    if (!c.on) continue;
    for (const w of parseCheat(c.code)) {
      for (let k = 0; k < w.size; k++) {
        wasm.gba_write8((w.addr + k) >>> 0, (w.value >>> (8 * k)) & 0xFF);
      }
    }
  }
}
setInterval(() => { if (running) applyCheats(); }, 100);

async function loadCheats() {
  cheats = (await idbGet('cheats:' + romId)) || [];
  cheatParsed.clear();
}
async function saveCheats() { await idbPut('cheats:' + romId, cheats); }


async function importCheatFile(file) {
  try {
    const text = await file.text();
    let items = [];
    if (text.trim().startsWith('{')) {
      const j = JSON.parse(text);
      if (j && Array.isArray(j.cheats)) {
        items = j.cheats.map(c => ({ name: c.name || '未命名', code: String(c.code || ''), on: !!c.on }));
        if (j.game && j.game.id && j.game.id !== romId) {
          toast('注意：这份金手指是给其它 ROM 的，已照常导入');
        }
      }
    } else {
      for (const raw of text.split(/\r?\n/)) {
        const line = raw.trim();
        if (!line || line.startsWith('#') || line.startsWith(';')) continue;
        const m = line.split(/\s*[|,]\s*/);
        if (m.length >= 2) items.push({ name: m[0], code: m.slice(1).join(' '), on: true });
        else items.push({ name: '代码 ' + line.slice(0, 8), code: line, on: true });
      }
    }
    if (!items.length) return toast('文件里没有可识别的金手指');
    cheats = cheats.concat(items);
    await saveCheats();
    toast('已导入 ' + items.length + ' 条金手指');
    openMenu();
  } catch (e) {
    toast('导入失败: ' + e);
  }
}

/* ================= UI ================= */
let _toastLast = '', _toastLastAt = 0;
function toast(msg) {
  msg = String(msg);
  const now = performance.now();
  // 去重：相同内容 1.2s 内不重复弹，避免连续错误/误触刷屏造成卡顿
  if (msg === _toastLast && now - _toastLastAt < 1200) return;
  _toastLast = msg; _toastLastAt = now;
  // 数量上限：最多同时保留 3 条，多的直接移除最旧的
  const old = document.querySelectorAll('body > .toast');
  for (let i = 0; i < old.length - 2; i++) old[i].remove();
  const d = document.createElement('div');
  d.className = 'toast'; d.textContent = msg;
  document.body.appendChild(d); setTimeout(() => d.remove(), 1500);
}
function sheet(html) { $('sheet').innerHTML = html; $('modal').classList.add('on'); }
function closeSheet() {
  if (keyTestRaf) { cancelAnimationFrame(keyTestRaf); keyTestRaf = 0; }
  document.body.classList.remove('modalTop');
  $('modal').classList.remove('on');
}
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeSheet(); });

/** 按键测试面板：实时点亮当前按下的按键（键盘 / 手柄 / 触屏通用） */
function openKeyTest() {
  document.body.classList.add('modalTop');
  const btn = (label, bits, cls) => `<div class="ktKey ${cls || ''}" data-ktbits="${bits}">${label}</div>`;
  sheet(`<h3>🎯 按键测试</h3>
    <div class="ktPanel">
      <div class="ktCluster">
        ${btn('▲', KEYS.UP, 'kup')}
        <div class="ktMid">${btn('◀', KEYS.LEFT, 'kleft')}${btn('●', 0, 'kdot')}${btn('▶', KEYS.RIGHT, 'kright')}</div>
        ${btn('▼', KEYS.DOWN, 'kdown')}
      </div>
      <div class="ktCluster ktAB">
        ${btn('L', KEYS.L, 'ksmall')}${btn('R', KEYS.R, 'ksmall')}
        ${btn('B', KEYS.B, 'krnd')}${btn('A', KEYS.A, 'krnd')}
      </div>
    </div>
    <div class="ktRow">${btn('SELECT', KEYS.SELECT, 'kwide')}${btn('START', KEYS.START, 'kwide')}</div>
    <div class="hint">按下键盘 / 手柄 / 触屏上的任意按键，对应键位会高亮。手柄 X 快存、Y 快读、Select+Start 呼出菜单。</div>
    <div class="row"><button class="primary" id="ktClose">关闭测试</button></div>`);
  const paintTest = () => {
    // 测试面板独立读取手柄，即使未在游戏中的设置页也能看到映射
    let gp = 0;
    try {
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      for (const p of pads) {
        if (!p || !p.connected) continue;
        const btn = i => !!(p.buttons[i] && (p.buttons[i].pressed || p.buttons[i].value > 0.5));
        if (btn(0)) gp |= KEYS.A; if (btn(1)) gp |= KEYS.B;
        if (btn(4) || btn(6)) gp |= KEYS.L; if (btn(5) || btn(7)) gp |= KEYS.R;
        if (btn(9)) gp |= KEYS.START; if (btn(8)) gp |= KEYS.SELECT;
        if (btn(12)) gp |= KEYS.UP; if (btn(13)) gp |= KEYS.DOWN;
        if (btn(14)) gp |= KEYS.LEFT; if (btn(15)) gp |= KEYS.RIGHT;
        const ax = p.axes[0] || 0, ay = p.axes[1] || 0, dz = 0.35;
        if (ax < -dz) gp |= KEYS.LEFT; else if (ax > dz) gp |= KEYS.RIGHT;
        if (ay < -dz) gp |= KEYS.UP; else if (ay > dz) gp |= KEYS.DOWN;
        break;
      }
    } catch (e) {}
    document.querySelectorAll('#sheet [data-ktbits]').forEach(el => {
      const bits = +el.dataset.ktbits;
      el.classList.toggle('on', bits !== 0 && ((keyMask | gp) & bits) !== 0);
    });
    keyTestRaf = requestAnimationFrame(paintTest);
  };
  paintTest();
  const close = $('ktClose'); if (close) close.onclick = closeSheet;
}

/** 为当前二级页绑定等价 handler：全部复用现有全局变量与 applyXxx / resize 等函数。 */
function wireSettingsSub(key) {
  const root = $('setSubContent'); if (!root) return;
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  const each = (sel, fn) => root.querySelectorAll(sel).forEach(fn);

  if (key === 'video') {
    each('[data-pix]', b => b.onclick = () => {
      pixelMode = b.dataset.pix;
      localStorage.setItem('pixelMode', pixelMode);
      imgData = null; imgBuffer = null; prevValid = false;
      glLastGood = false; glBlackRun = 0;
      // 用户主动再选增强档位时，给 GPU 一次重新初始化的机会
      if (!GL.ok && (pixelMode === 'enhance' || pixelMode === 'xbr' || pixelMode === 'crt') && GL.failCount < 4) {
        GL.failCount = 0; initGL();
      }
      resize(); rerenderSetSub();
      const tips = { raw:'原始像素：最锐利但格子最大', enhance:'清晰：自适应锐化',
        xbr:'XBR 超清：斜线顺滑、文字清晰', crt:'CRT 复古：显像管质感 + 扫描线',
        smooth:'平滑拉伸：柔化放大' };
      toast((GL.ok && pixelMode !== 'raw' && pixelMode !== 'smooth' ? 'GPU · ' : '') + (tips[pixelMode] || pixelMode));
    });
    const gs = $('setGlSharp');
    if (gs) gs.oninput = e => {
      glSharp = parseFloat(e.target.value);
      localStorage.setItem('glSharp', String(glSharp));
      const lab = $('setGlSharpV'); if (lab) lab.textContent = glSharp;
    };
    on('setGlScan', () => {
      glScanline = !glScanline;
      localStorage.setItem('glScanline', glScanline ? '1' : '0');
      rerenderSetSub();
      toast(glScanline ? '已开启扫描线' : '已关闭扫描线');
    });
    on('setBestQuality', () => {
      pixelMode = GL.ok ? 'xbr' : 'enhance';
      glSharp = 70; glScanline = true;
      localStorage.setItem('pixelMode', pixelMode);
      localStorage.setItem('glSharp', '70');
      localStorage.setItem('glScanline', '1');
      if (overlay === 'scan' || overlay === 'dot' || overlay === 'lcd') {
        overlay = 'none'; localStorage.setItem('overlay', 'none');
      }
      imgData = null; imgBuffer = null; prevValid = false;
      resize(); rerenderSetSub();
      toast(GL.ok ? '已应用最佳画质：XBR 超清 + 强锐化' : '已应用最佳画质（基础渲染）');
    });
    const setZoomValue = v => {
      zoom = Math.min(3, Math.max(0.5, Math.round(v * 20) / 20));
      localStorage.setItem('zoom', String(zoom));
      resize();
      const r = $('setZoomRange'); if (r) r.value = zoom.toFixed(2);
    };
    on('setZoomOut', () => setZoomValue(zoom - 0.1));
    on('setZoomIn', () => setZoomValue(zoom + 0.1));
    const zr = $('setZoomRange');
    if (zr) zr.oninput = e => setZoomValue(parseFloat(e.target.value));
    each('[data-mode]', b => b.onclick = () => {
      screenMode = b.dataset.mode;
      localStorage.setItem('screenMode', screenMode);
      resize(); rerenderSetSub();
    });
    on('setFitScreen', () => {
      zoom = 1; screenMode = 'fit';
      localStorage.setItem('zoom', '1');
      localStorage.setItem('screenMode', 'fit');
      resize(); rerenderSetSub();
      toast('已恢复适应屏幕');
    });
    each('[data-filter]', b => b.onclick = () => {
      filter = b.dataset.filter;
      localStorage.setItem('filter', filter);
      resize(); rerenderSetSub();
    });
    on('setAntiFlash', () => {
      antiFlash = !antiFlash;
      localStorage.setItem('antiFlash', antiFlash ? '1' : '0');
      rerenderSetSub();
      toast(antiFlash ? '已开启转场防闪' : '已关闭转场防闪');
    });
    each('[data-ov]', b => b.onclick = () => {
      overlay = b.dataset.ov;
      localStorage.setItem('overlay', overlay);
      resize(); rerenderSetSub();
    });
    const ovs = $('setOvStrength');
    if (ovs) ovs.oninput = e => {
      overlayStrength = parseFloat(e.target.value);
      localStorage.setItem('overlayStrength', String(overlayStrength));
      resize();
    };
    const wireAdj = (id, k) => {
      const el = $(id); if (!el) return;
      el.oninput = e => {
        colorAdj[k] = parseFloat(e.target.value);
        localStorage.setItem('colorAdj', JSON.stringify(colorAdj));
        applyOverlay(1);
      };
    };
    wireAdj('setAdjB', 'b'); wireAdj('setAdjC', 'c'); wireAdj('setAdjS', 's');
    on('setShot', screenshot);
  } else if (key === 'audio') {
    on('setBtnMute', () => {
      audioMuted = !audioMuted;
      localStorage.setItem('audioMuted', audioMuted ? '1' : '0');
      audioApplyVolume(); rerenderSetSub();
      toast(audioMuted ? '已静音' : '已取消静音');
    });
    const av = $('setAudioVol');
    if (av) av.oninput = e => {
      audioVol = parseFloat(e.target.value);
      localStorage.setItem('audioVol', String(audioVol));
      audioApplyVolume();
      const lab = $('setAudioVolV'); if (lab) lab.textContent = audioVol;
    };
  } else if (key === 'input') {
    // 复用原有渲染函数：ID / data-* 未变，切换即时生效
    buildSkinGrid(); buildShapeGrid(); buildPadModeGrid();
    applySkin(keyTheme); applyShape(keyShape); applyPadMode(padMode);
    const applyPadScale = v => {
      padCfg.scale = Math.min(1.2, Math.max(0.85, Math.round(v * 20) / 20));
      savePadCfg(); placePad();
      const slider = $('setPadSize'); if (slider) slider.value = padCfg.scale;
    };
    const ps = $('setPadSize');
    if (ps) ps.oninput = e => applyPadScale(parseFloat(e.target.value));
    on('setPadSmaller', () => applyPadScale((padCfg.scale || 1) - 0.1));
    on('setPadBigger', () => applyPadScale((padCfg.scale || 1) + 0.1));
    on('setEditPad', () => toast('按键位置请在游戏内 ☰ → 按键 → 自定义按键位置 中调整'));
    on('setResetPad', () => {
      padCfg = JSON.parse(JSON.stringify(DEF_PAD));
      savePadCfg(); placePad(); rerenderSetSub();
      toast('按键布局已重置');
    });
    // v1.4 手柄 / 震动 / 连发
    on('setGpToggle', () => {
      gamepadOn = !gamepadOn; saveExtras();
      if (!gamepadOn && gamepadBits) { gamepadBits = 0; recompute(); }
      rerenderSetSub(); toast(gamepadOn ? '手柄已启用' : '手柄已关闭');
    });
    on('setGpTest', () => { closeSettings(); openKeyTest(); });
    // v1.6 触屏按键显示
    each('[data-padhide]', b => b.onclick = () => {
      padHide = b.dataset.padhide; saveExtras(); applyPadVisibility(); rerenderSetSub();
      toast('触屏按键：' + ({always:'始终显示',gamepad:'接手柄时隐藏',never:'始终隐藏'}[padHide]));
    });
    const po = $('setPadOpacity'); if (po) po.oninput = e => {
      padOpacity = Math.min(100, Math.max(20, +e.target.value || 100)); saveExtras(); applyPadVisibility();
      const lab = $('padOpacityV'); if (lab) lab.textContent = padOpacity + '%';
    };
    on('setVibToggle', () => {
      vibrateOn = !vibrateOn; saveExtras(); rerenderSetSub();
      if (vibrateOn) { try { navigator.vibrate && navigator.vibrate([10]); } catch (e) {} }
      toast(vibrateOn ? '触感反馈已开启' : '触感反馈已关闭');
    });
    each('[data-viblv]', b => b.onclick = () => {
      vibrateLv = +b.dataset.viblv; saveExtras(); rerenderSetSub();
      try { if (navigator.vibrate) navigator.vibrate([ [0,8,14,22][vibrateLv] ]); } catch (e) {}
      toast('震动强度：' + ({1:'轻',2:'中',3:'强'}[vibrateLv]));
    });
    each('[data-turbo]', b => b.onclick = () => {
      const k = b.dataset.turbo;
      turboCfg[k].on = !turboCfg[k].on; saveExtras(); rerenderSetSub();
      toast(k + ' 连发：' + (turboCfg[k].on ? '开' : '关'));
    });
    each('[data-turborate]', s => s.oninput = e => {
      const k = s.dataset.turborate;
      turboCfg[k].rate = clampRate(e.target.value); saveExtras();
      const lab = $(k === 'A' ? 'turboARateV' : 'turboBRateV');
      if (lab) lab.textContent = turboCfg[k].rate;
    });
  } else if (key === 'hotkey') {
    const root2 = $('setSubContent');
    root2.querySelectorAll('[data-hk]').forEach(b => b.onclick = () => {
      capturingHK = b.dataset.hk;
      toast('请按下一个按键作为「' + b.closest('.slot').querySelector('.n').textContent + '」快捷键');
    });
    on('hkReset', () => { hotkeys = Object.assign({}, HK_DEFAULT); saveExtras(); rerenderSetSub(); toast('已恢复默认快捷键'); });
    on('setRewindToggle', () => {
      rewindOn = !rewindOn; saveExtras();
      if (!rewindOn) { rwStop(); rwClear(); }
      rerenderSetSub(); toast(rewindOn ? '回溯已开启（约 4.8 秒）' : '回溯已关闭');
    });
    on('setKeyTest', () => openKeyTest());
  } else if (key === 'layout') {
    buildUiThemeGrid();
    applyUiTheme(uiTheme);
    renderThemePreview(uiTheme);
    const grid = $('uiThemeGrid');
    if (grid) grid.querySelectorAll('.skinOpt').forEach(el =>
      el.addEventListener('click', () => renderThemePreview(el.dataset.uitheme)));
    on('setGoalSave', () => {
      const input = $('setGoalInput');
      const v = input ? parseInt(input.value, 10) : NaN;
      if (!Number.isFinite(v) || v < 1 || v > 1440) { toast('请输入 1–1440 之间的分钟数'); return; }
      stats.dailyGoalMin = v; statsDirty = true; saveStats();
      if (typeof scheduleHomeRefresh === 'function') scheduleHomeRefresh('full');
      toast('今日目标已设为 ' + v + ' 分钟');
    });
  } else if (key === 'misc') {
    on('setSpeedBtn', () => {
      speed = speed === 1 ? 2 : speed === 2 ? 4 : 1;
      if (speed === 1 && audio) { try { audio.reset(); } catch (e) {} }
      rerenderSetSub();
      toast(speed > 1 ? speed + '× 快进（音频静音）' : '正常速度 · 音频已恢复');
    });
    on('setShowFps', () => {
      showFps = !showFps;
      localStorage.setItem('showFps', showFps ? '1' : '0');
      applyFpsPref(); rerenderSetSub();
      toast(showFps ? '已显示帧率' : '已隐藏帧率');
    });
    on('setAutoSave', () => {
      autoSaveOn = !autoSaveOn;
      localStorage.setItem('autoSave', autoSaveOn ? '1' : '0');
      rerenderSetSub();
      toast(autoSaveOn ? '已开启退出自动存档' : '已关闭自动存档');
    });
    on('setBtnOpen', () => { closeSettings(); $('file').click(); });
    on('setBtnDemo', () => { closeSettings(); $('btnDemo').click(); });
    on('setBtnRestart', restartCurrentGame);
    renderSettingsRomList();
  } else if (key === 'advanced') {
    each('[data-fps]', b => b.onclick = () => {
      capFps = +b.dataset.fps;
      localStorage.setItem('capFps', String(capFps));
      rerenderSetSub();
      toast(capFps === 0 ? '帧率不限制' : '刷新上限 ' + capFps + ' fps');
    });
    on('setBtnOrient', () => { closeSettings(); toggleLandscape(); });
    on('setBtnOrientAuto', () => { exitRotated(); toast('已跟随手机自动旋转'); });
    each('[data-orlock]', b => b.onclick = async () => {
      lockOrient = b.dataset.orlock; saveExtras();
      try {
        if (!lockOrient) { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }
        else if (screen.orientation && screen.orientation.lock) await screen.orientation.lock(lockOrient);
        else toast('当前浏览器不支持方向锁定');
      } catch (e) { toast('方向锁定失败：需在全屏下或浏览器不支持'); }
      rerenderSetSub();
      toast('方向：' + (lockOrient || '自动'));
    });
    on('setDiagBtn', async () => {
      const out = $('setDiagOut'); if (!out) return;
      out.textContent = '正在检测…';
      out.textContent = await diagnostics();
    });
    on('setDiagCopy', async () => {
      const ok = await copyText(await diagnostics());
      toast(ok ? '诊断信息已复制' : '复制失败，请手动选择文本');
    });
    on('setResetAll', resetAllSettings);
  } else if (key === 'about') {
    on('setFeedback', () => openFeedback());
  }
}

/** 恢复所有偏好为出厂默认；绝不触碰 ROM / 存档 / 统计。 */
function resetAllSettings() {
  const put = (k, v) => { try { localStorage.setItem(k, String(v)); } catch (e) {} };
  // 外观（applyXxx 内部也会写入 localStorage，这里显式再写一次保证一致）
  applyUiTheme('nebula'); applySkin('klein'); applyShape('classic'); applyPadMode('dpad');
  put('uiTheme','nebula'); put('keyTheme','klein'); put('keyShape','classic'); put('padMode','dpad');
  // 画质
  pixelMode = 'xbr'; glSharp = 55; glScanline = true;
  overlay = 'none'; overlayStrength = 35;
  colorAdj = { b:100, c:100, s:100 };
  filter = 'sharp'; screenMode = 'smooth'; zoom = 1; intScale = 3; antiFlash = true;
  put('pixelMode', pixelMode); put('glSharp', glSharp); put('glScanline', '1');
  put('overlay', overlay); put('overlayStrength', overlayStrength);
  put('colorAdj', JSON.stringify(colorAdj)); put('filter', filter);
  put('screenMode', screenMode); put('zoom', '1'); put('scale', '3'); put('antiFlash', '1');
  imgData = null; imgBuffer = null; prevValid = false;
  glLastGood = false; glBlackRun = 0;
  // 帧率 / 音频 / 其它偏好
  capFps = 0; put('capFps', '0');
  audioMuted = false; audioVol = 70; put('audioMuted', '0'); put('audioVol', '70'); audioApplyVolume();
  showFps = false; autoSaveOn = true; put('showFps', '0'); put('autoSave', '1'); applyFpsPref();
  speed = 1;
  if (audio) { try { audio.reset(); } catch (e) {} }
  // 按键布局
  padCfg = JSON.parse(JSON.stringify(DEF_PAD)); savePadCfg(); placePad();
  // v1.4 增强偏好
  gamepadOn = true; vibrateOn = true; vibrateLv = 2; rewindOn = false;
  turboCfg = { A:{on:false,rate:12}, B:{on:false,rate:12} };
  hotkeys = Object.assign({}, HK_DEFAULT); lockOrient = '';
  padHide = 'always'; padOpacity = 100; applyPadVisibility(); rwClear(); saveExtras();
  // 重新应用画面
  resize(); applyOverlay(1);
  rerenderSetSub();
  toast('已恢复默认设置（ROM 与存档未改动）');
}

async function restartCurrentGame() {
  if (!romId) { toast('当前没有正在运行的游戏'); return; }
  const builtin = romId.indexOf('builtin:') === 0;
  let bytes = null;
  const name = romName || '游戏';
  if (builtin) {
    const g = BUILTIN_GAMES.find(x => x.id === romId);
    if (g) bytes = _builtinBytes[romId] || b64(g.b64);
  } else {
    const v = await idbGet('rom:' + romId);
    if (v && v.bytes) bytes = new Uint8Array(v.bytes);
    else {
      const m = await idbGet('meta:' + romId);
      if (m && m.bytes) bytes = new Uint8Array(m.bytes);
    }
  }
  if (!bytes) { toast('找不到当前游戏数据，请重新载入 ROM'); return; }
  closeSettings();
  await loadRom(bytes, name, romId, builtin);
  toast('已重新开始：' + name);
}

const fmt = t => {
  if (!t) return '空';
  const d = new Date(t);
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};

function wireTab() {
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  const body = $('tabBody');
  if (!body) return;

  body.querySelectorAll('[data-save]').forEach(b => b.onclick = async () => { await saveState(+b.dataset.save); openMenu(); });
  body.querySelectorAll('[data-load]').forEach(b => b.onclick = async () => { await loadState(+b.dataset.load); openMenu(); });
  body.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    const sl = b.dataset.del;
    await idbDel(`state:${romId}:${sl}`); await idbDel(`slotmeta:${romId}:${sl}`); await idbDel(`slotthumb:${romId}:${sl}`);
    toast('已删除档位 ' + sl);
    openMenu();
  });

  on('btnAutoLoad', async () => { closeSheet(); await autoResume(); });
  on('btnAutoToggle', () => {
    autoSaveOn = !autoSaveOn;
    localStorage.setItem('autoSave', autoSaveOn ? '1' : '0');
    const b = $('btnAutoToggle'); if (b) b.textContent = '自动存档：' + (autoSaveOn ? '开' : '关');
    toast(autoSaveOn ? '已开启退出自动存档' : '已关闭自动存档');
  });
  on('btnSavExport', exportSav);
  on('btnSavImport', () => { const f = $('savFile'); if (f) f.click(); });
  const savFile = $('savFile');
  if (savFile) savFile.onchange = e => { const f = e.target.files[0]; if (f) importSav(f); e.target.value = ''; };

  // ---- video tab ----
  const setZoom = v => {
    zoom = Math.min(3, Math.max(0.5, Math.round(v * 20) / 20));
    localStorage.setItem('zoom', zoom);
    resize();
    const r = $('zoomRange'); if (r) r.value = zoom;
  };
  on('zoomOut', () => setZoom(zoom - 0.1));
  on('zoomIn', () => setZoom(zoom + 0.1));
  const zr = $('zoomRange');
  if (zr) zr.oninput = e => setZoom(parseFloat(e.target.value));
  body.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    screenMode = b.dataset.mode;
    localStorage.setItem('screenMode', screenMode);
    resize();
    openMenu();
  });
  body.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => {
    filter = b.dataset.filter;
    localStorage.setItem('filter', filter);
    resize();
    openMenu();
  });
  on('btnShot', screenshot);
  on('btnShare', shareShot);
  body.querySelectorAll('[data-pix]').forEach(b => b.onclick = () => {
    pixelMode = b.dataset.pix;
    localStorage.setItem('pixelMode', pixelMode);
    imgData = null; imgBuffer = null; prevValid = false;
    glLastGood = false; glBlackRun = 0;
    // 用户主动再选增强档位时，给 GPU 一次重新初始化的机会
    if (!GL.ok && (pixelMode==='enhance'||pixelMode==='xbr'||pixelMode==='crt') && GL.failCount < 4) {
      GL.failCount = 0; initGL();
    }

let landscapeLocked = false;
// 物理横屏与软件 rot90 互斥：物理已经横屏时，撤销 rot90，避免画面被二次旋转成竖屏比例。
// 场景：先点了软件横屏(rot90)，随后手机物理旋转 → 两者叠加 → 画面错乱成竖屏。
function syncRotation() {
  const physLand = matchMedia('(orientation:landscape)').matches;
  if (physLand && document.body.classList.contains('rot90')) {
    document.body.classList.remove('rot90');
    landscapeLocked = true;           // 物理横屏已达成，无需再软件旋转
    toast('已切换为系统横屏');
    setTimeout(() => { placePad(); resize(); }, 120);
    setTimeout(() => { placePad(); resize(); }, 420);
  }
}
function exitRotated() {
  document.body.classList.remove('rot90');
  if (screen.orientation && screen.orientation.unlock) { try { screen.orientation.unlock(); } catch (e) {} }
  landscapeLocked = false;
  setTimeout(() => { placePad(); resize(); }, 120);
  setTimeout(() => { placePad(); resize(); }, 420);
}
async function toggleLandscape() {
  if (document.body.classList.contains('rot90')) { exitRotated(); toast('已恢复竖屏'); return; }
  // 手机已经是物理横屏：无需软件旋转，也绝不能再叠加 rot90（会把画面转成竖屏）
  if (matchMedia('(orientation:landscape)').matches) {
    landscapeLocked = true;
    toast('当前已是横屏');
    setTimeout(() => { placePad(); resize(); }, 120);
    return;
  }
  try {
    if (!landscapeLocked) {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
      }
      if (screen.orientation && screen.orientation.lock) {
        await screen.orientation.lock('landscape');
        landscapeLocked = true;
        toast('已锁定横屏，再点一次恢复');
      } else {
        toast('此浏览器不支持锁定方向，请手动横过手机');
      }
    } else {
      if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
      landscapeLocked = false;
      toast('已恢复自动旋转');
    }
  } catch (e) {
    // Browser refused fullscreen / lock: rotate the player ourselves.
    // 兜底：只有物理竖屏时才软件旋转，物理横屏下叠加会毁掉画面。
    if (matchMedia('(orientation:landscape)').matches) {
      landscapeLocked = true;
      toast('已进入横屏');
    } else {
      document.body.classList.add('rot90');
      toast('已用画面旋转进入横屏（点右上角退出）');
    }
  }
  setTimeout(() => { placePad(); resize(); }, 250);
  setTimeout(() => { placePad(); resize(); }, 700);
}

let allRows = [];
async function refreshLib() {
  const rows = [];
  try {
    // one-off: older builds kept carts under "meta:" without bytes
    for (const k of await idbKeys()) {
      const s = String(k);
      if (s.startsWith('meta:')) {
        const v = await idbGet(s);
        const romKey = 'rom:' + s.slice(5);
        const existing = await idbGet(romKey);
        // 新导入流程已写入带中文 title 的 rom: 记录，不再被 meta 里的 ROM 内部标题覆盖
        if (v && v.bytes && !(existing && existing.bytes)) await idbPut(romKey, v);
        await idbDel(s);
      }
    }
    const keys = await idbKeys();
    for (const k of keys) {
      const s = String(k);
      if (!s.startsWith('rom:')) continue;
      const v = await idbGet(s);
      if (v && (v.bytes || v.noBytes)) rows.push({ id: s.slice(4), name: v.name, size: v.size, at: v.at || 0, title: v.title || '' });
    }
  } catch (e) {
    toast('读取列表失败: ' + e);
  }
  rows.sort((a, b) => b.at - a.at);
  // 内嵌游戏置顶（不写 IndexedDB，直接随页面分发）；id 用 'builtin:' 前缀区分。
  for (const g of BUILTIN_GAMES) {
    rows.unshift({ id: g.id, name: g.name, size: g.size, at: 0, title: g.name.replace(/\.gba$/i, ''), builtin: true });
  }
  allRows = rows;
  $('lastBox').innerHTML = '';
  const lastId = localStorage.getItem('lastRom');
  const lastRow = rows.find(r => r.id === lastId);
  if (lastRow) {
    const el = document.createElement('div');
    el.className = 'card';
    el.style.borderColor = '#6b52e8';
    el.innerHTML = `<div><div class="t">▶ 继续游玩 · ${esc(lastRow.title || lastRow.name)}</div>
      <div class="s">${lastRow.builtin ? '内置游戏' : '上次玩到 ' + fmt(lastRow.at)}</div></div>`;
    el.onclick = () => openRow(lastRow);
    $('lastBox').appendChild(el);
  }
  renderRows('');
  $('q').oninput = e => renderRows(e.target.value.trim());
  scheduleHomeRefresh('full');              // 统计：游戏列表变化后同步看板数据卡
}

function renderRows(filter) {
  const rows = allRows.filter(r => {
    if (!filter) return true;
    const hay = ((r.title || '') + ' ' + (r.name || '')).toLowerCase();
    return hay.includes(filter.toLowerCase());
  });
  const list = $('list');
  $('recentTitle').style.display = allRows.length ? 'block' : 'none';
  list.innerHTML = rows.length ? '' :
    (allRows.length ? '<div class="empty"><span class="emptyIc">🔍</span>没找到匹配的游戏</div>'
                    : '<div class="empty"><span class="emptyIc">🎮</span>这里还空着<br>点右下角的「＋」导入 .gba 文件、zip 压缩包或整个文件夹</div>');
  for (const r of rows) {
    const el = document.createElement('div');
    el.className = 'card';
    const title = r.title || r.name;
    el.innerHTML = `<div><div class="t">${r.builtin ? '⭐ ' : ''}${esc(title)}${r.builtin ? ' <span class="builtinTag">内置</span>' : ''}</div>
      <div class="s">${r.builtin ? '内嵌游戏 · 点开即玩' : '上次游玩 ' + fmt(r.at)}</div></div><div class="play">▶</div>`;
    el.onclick = () => openRow(r);
    el.oncontextmenu = async ev => {
      ev.preventDefault();
      if (r.builtin) { toast('内置游戏无法删除'); return; }
      if (!confirm('删除《' + title + '》？存档也会删除。')) return;
      await idbDel('rom:' + r.id); await idbDel('sram:' + r.id);
      for (let i = 1; i <= 4; i++) { await idbDel(`state:${r.id}:${i}`); await idbDel(`slotmeta:${r.id}:${i}`); }
      refreshLib();
    };
    list.appendChild(el);
  }
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function diagnostics() {
  const lines = [];
  lines.push('GBA 60Hz 反馈 v3');
  lines.push('时间: ' + new Date().toLocaleString());
  lines.push('UA: ' + navigator.userAgent);
  lines.push('屏幕: ' + screen.width + 'x' + screen.height + ' dpr=' + (window.devicePixelRatio || 1) +
    ' 方向=' + (matchMedia('(orientation:landscape)').matches ? 'landscape' : 'portrait'));
  lines.push('游戏: ' + (romName || '(未载入)') + ' id=' + (romId || '-'));
  const up = startedAt ? Math.round((performance.now() - startedAt) / 1000) : 0;
  lines.push('运行: ' + up + 's fps=' + fps.toFixed(1) + ' 速度=' + speed + 'x 缩放=' + (intScale ? '整数' : '自适应') +
    ' 滤镜=' + filter + ' 画质=' + (typeof pixelMode !== 'undefined' ? pixelMode : '-'));
  // 音频/渲染后端：定位无声、黑帧、掉帧类问题的关键线索
  try {
    const aMode = audioOn && audio ? audio.mode : 'off';
    const glOn = (typeof GL !== 'undefined' && GL.ok && typeof useGL === 'function' && useGL());
    lines.push('音频: ' + aMode + (audioMuted ? '(静音)' : ' vol=' + audioVol) +
      ' 渲染: ' + (glOn ? 'WebGL' : 'Canvas2D'));
  } catch (e) {}
  if (performance.memory) lines.push('JS堆: ' + (performance.memory.usedJSHeapSize / 1048576).toFixed(1) + 'MB');
  try {
    const e = await navigator.storage.estimate();
    lines.push('存储: ' + (e.usage / 1048576).toFixed(1) + ' / ' + (e.quota / 1048576).toFixed(0) + 'MB');
  } catch (e) {}
  if (lastErr) lines.push('最近的错误: ' + lastErr);
  const cl = localStorage.getItem('crashlog');
  if (cl) lines.push('崩溃记录: ' + cl.replace(/\n/g, ' | '));
  return lines.join('\n');
}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) { return false; }
}

    else if (v && v.bytes) sz = v.bytes.byteLength;
    let q = '';
    try { const e = await navigator.storage.estimate(); q = '\n用量 ' + (e.usage/1048576).toFixed(1) + ' / 配额 ' + (e.quota/1048576).toFixed(0) + ' MB'; } catch (e) {}
    rows.push(String(k) + (sz ? '  ' + (sz/1048576).toFixed(2) + 'MB' : ''));
  }
  sheet('<h3>存储诊断</h3><div class="hint">' + esc(rows.join('\n')) + q + '</div>' +

let pendingAutoResume = false;
async function openRow(r) {
  let bytes, name;
  if (r.builtin) {
    // 内嵌游戏：从 base64 首次解码并缓存，之后复用；存档仍按该 id 独立读写
    if (!_builtinBytes[r.id]) {
      const g = BUILTIN_GAMES.find(x => x.id === r.id);
      if (!g) return toast('内置游戏数据缺失');
      toast('正在载入 ' + g.name + ' …');
      _builtinBytes[r.id] = b64(g.b64);
    }
    bytes = _builtinBytes[r.id]; name = r.name;
  } else {
    const v = await idbGet('rom:' + r.id);
    if (!v || !v.bytes) return toast('ROM 数据丢失，请重新导入');
    bytes = new Uint8Array(v.bytes); name = v.name;
  }
  localStorage.setItem('lastRom', r.id);
  const meta = autoSaveOn ? await idbGet(`slotmeta:${r.id}:auto`) : null;
  pendingAutoResume = false;
  if (meta && confirm(`发现自动存档（${fmt(meta)}）。\n\n确定 = 接着上次进度玩\n取消 = 从头开始`)) {
    pendingAutoResume = true;
  }
  await loadRom(bytes, name, r.id, !!r.builtin);
  if (pendingAutoResume) { pendingAutoResume = false; await autoResume(); }
}

};

/* ================= 导入：文件 / ZIP / 文件夹 =================
 * - 右下角 FAB 是游戏库主入口，菜单两个来源：文件或文件夹。
 * - ZIP 通过中央目录枚举条目；store 直取，deflate 交原生 DecompressionStream('deflate-raw')。
 * - 全程 try/catch，单个失败不影响其它；结束给一条汇总 toast。
 * - 存储格式保持一致：{name,size,at,title,bytes}，id 仍用 sha1Hex。 */
const IMP_MAX_BYTES = 512 * 1024 * 1024;          // 单个游戏上限 512MB
const IMP_ROM_RE = /\.(gba|bin|agb)$/i;
const IMP_CJK_RE = /[\u3400-\u9fff\u3040-\u30ff\uac00-\ud7af]/;

/** 中文友好的游戏名清理：去扩展名/地区与 CRC 标签，去下划线，保留中文主体。 */
function cleanGameName(input) {
  let s = String(input || '').replace(/\\/g, '/');
  s = s.replace(/^.*\//, '');                                     // 只取路径最后一段（ZIP 内相对名）
  s = s.replace(/\.(gba|bin|agb|zip)$/i, '');                     // 去扩展名
  s = s.replace(/\s*[\[（(][^\])）]*[\])）]\s*/g, ' ');           // 去 (USA)/[!]/(U)/(Rev A) 等标签
  s = s.replace(/[_\s]+/g, ' ').trim();                           // 下划线/连续空白规整
  s = s.replace(/^(?:OHX|EMU|FLUB|TCG|AMJ)\b[\s-]*/i, '');        // 去常见英文冗余前缀
  s = s.replace(/\b(?:CRC\d*|bad dump|alternate|fixed)\b[\s-]*/gi, '');
  s = s.replace(/[\s-]+$/, '').trim();
  if (!s) return '';
  if (IMP_CJK_RE.test(s)) {                                       // 含中文时优先保留中文片段
    const parts = s.split(/[\s\-–—]+/).filter(Boolean);
    const cjk = parts.filter(p => IMP_CJK_RE.test(p));
    if (cjk.length) s = cjk.join(' ');
  }
  return s.trim();
}

/** ZIP 条目名解码：UTF-8 优先，非法序列时回退 GBK（兼容 Windows 中文压缩包）。 */
function impDecodeName(bytes) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(bytes); }
  catch (e) {
    try { return new TextDecoder('gbk').decode(bytes); }
    catch (e2) { return new TextDecoder('utf-8').decode(bytes); }
  }
}

/** deflate-raw 解压：优先浏览器原生 DecompressionStream，不支持时抛友好错误。 */
async function impInflateRaw(data) {
  if (typeof DecompressionStream === 'undefined') {
    throw new Error('当前浏览器不支持解压 deflate 压缩包，请改用普通 .gba 文件');
  }
  const ds = new DecompressionStream('deflate-raw');
  const stream = new Blob([data]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

/** 内联轻量 ZIP 读取：枚举中央目录，提取其中的游戏文件。 */
async function impReadZip(ab) {
  const dv = new DataView(ab), len = ab.byteLength;
  if (len < 22) throw new Error('文件过小，不是有效 ZIP');
  const u16 = o => dv.getUint16(o, true), u32 = o => dv.getUint32(o, true);
  let eocd = -1;
  for (let i = len - 22; i >= Math.max(0, len - 65557); i--) {
    if (u32(i) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('找不到 ZIP 目录');
  const total = u16(eocd + 10);
  let p = u32(eocd + 16);
  if (total === 0xffff || p === 0xffffffff) throw new Error('暂不支持 ZIP64 超大压缩包');
  const out = [];
  for (let i = 0; i < total; i++) {
    if (p + 46 > len || u32(p) !== 0x02014b50) break;
    const flag = u16(p + 8), method = u16(p + 10);
    const csize = u32(p + 20), usize = u32(p + 24);
    const nlen = u16(p + 28), elen = u16(p + 30), clen = u16(p + 32);
    const lho = u32(p + 42);
    if (p + 46 + nlen > len) break;
    const name = impDecodeName(new Uint8Array(ab, p + 46, nlen));
    p += 46 + nlen + elen + clen;
    if (/\/$/.test(name) || !IMP_ROM_RE.test(name)) continue;
    if (flag & 0x1) { toast('跳过加密文件: ' + name); continue; }
    if (usize === 0xffffffff || csize === 0xffffffff || lho === 0xffffffff) {
      toast('跳过 ZIP64 条目: ' + name); continue;
    }
    if (usize > IMP_MAX_BYTES) { toast('跳过超大文件: ' + name); continue; }
    if (lho + 30 > len || u32(lho) !== 0x04034b50) continue;
    const start = lho + 30 + u16(lho + 26) + u16(lho + 28);
    if (start + csize > len) continue;
    let data = new Uint8Array(ab, start, csize);
    try {
      if (method === 0) data = new Uint8Array(data);            // 复制为独立 buffer
      else if (method === 8) data = await impInflateRaw(data);
      else { toast('跳过不支持的压缩方式(' + method + '): ' + name); continue; }
    } catch (err) {
      toast('解压失败 ' + name + ': ' + (err && err.message ? err.message : err));
      continue;
    }
    if (data.length > IMP_MAX_BYTES) { toast('跳过超大文件: ' + name); continue; }
    out.push({ name: name.replace(/^.*\//, ''), data });
    data = null;
  }
  return out;
}

let _impSeq = 0;
/** 单个 ROM 落库：校验 → 生成 id → 中文 title → idbPut。 */
async function impSaveRom(bytes, fileName) {
  if (bytes.byteOffset !== 0 || bytes.byteLength !== bytes.buffer.byteLength) {
    bytes = new Uint8Array(bytes);                               // 保证 buffer 独立，避免连带整个 ZIP
  }
  if (bytes.length < 0xC0) return null;
  if (bytes.length > IMP_MAX_BYTES) { toast('跳过超大文件(>512MB): ' + fileName); return null; }
  let id;
  try { id = await sha1Hex(bytes); } catch (e) { id = 'rom' + Date.now() + '_' + (_impSeq++); }
  const title = cleanGameName(fileName) || romTitle(bytes) || String(fileName);
  try {
    await idbPut('rom:' + id, {
      name: fileName, size: bytes.length, at: Date.now(),
      title: title, bytes: bytes.buffer
    });
  } catch (e) { /* 内存兜底已写入，忽略持久化失败 */ }
  return { buf: bytes, name: fileName, id, title };
}

/** 统一导入入口：自动识别 .gba / .zip，文件夹来源传入递归 FileList。 */
async function impHandleFiles(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) { toast('没有选择文件'); return; }
  const singleRom = files.length === 1 && IMP_ROM_RE.test(files[0].name);
  let ok = 0, skipped = 0, first = null;
  for (const f of files) {
    const lower = f.name.toLowerCase();
    try {
      toast('读取 ' + f.name + ' …');
      if (IMP_ROM_RE.test(lower)) {
        let ab = await f.arrayBuffer();
        const added = await impSaveRom(new Uint8Array(ab), f.name);
        ab = null;
        if (added) { ok++; if (!first) first = added; } else skipped++;
      } else if (lower.endsWith('.zip')) {
        let ab = await f.arrayBuffer();
        const entries = await impReadZip(ab);
        ab = null;
        let zipOk = 0;
        for (const ent of entries) {
          const added = await impSaveRom(ent.data, ent.name);
          ent.data = null;
          if (added) { ok++; zipOk++; if (!first) first = added; } else skipped++;
        }
        if (!zipOk) { skipped++; toast('压缩包内没有可用游戏: ' + f.name); }
      } else {
        skipped++;
      }
    } catch (err) {
      skipped++;
      toast('处理失败: ' + f.name + (err && err.message ? ' (' + err.message + ')' : ''));
      if (err && err.stack) logCrash('import: ' + err.stack);
    }
  }
  try { await refreshLib(); } catch (e) { /* 列表刷新失败不影响已入库数据 */ }
  toast('成功导入 ' + ok + ' 个，跳过 ' + skipped + ' 个');
  if (first && singleRom) {
    try { await loadRom(first.buf, first.name, first.id); }
    catch (err) { toast('载入游戏失败: ' + (err && err.message ? err.message : err)); logCrash('loadRom: ' + err); }
  }
  first = null;
}

/* ── 文件夹导入能力检测（BUGFIX-IMPORT-DIR-001） ────────────────────────
   webkitdirectory 是 Chromium/WebView 私有属性，iOS Safari 与多数国产浏览器
   WebView 并未实现。这些环境点「添加游戏文件夹」后要么弹普通单文件选择器、
   要么毫无反应（用户原话："并没有选择文件夹的机会给我"），且拿不到目录内的
   文件列表，连批量 zip 也无从导入 —— 两个症状同源。
   这里只探测一次：支持则照旧走目录选择；不支持则降级到已 multiple 且 accept
   含 .gba/.zip 的 #file，一次多选即可获得等价的批量导入能力。 */
function impSupportsDirectory() {
  try {
    const probe = document.createElement('input');
    if (!('webkitdirectory' in probe)) return false;
    probe.webkitdirectory = true;
    // 真属性应当被反射回 content attribute；反射失败(只读/空实现)也视为不支持。
    return probe.webkitdirectory === true && probe.hasAttribute('webkitdirectory');
  } catch (e) {
    return false;
  }
}
const IMP_HAS_DIR = impSupportsDirectory();

/** 按浏览器能力更新菜单文案，避免用户误以为「添加文件夹」按钮坏了。 */
function impSyncDirMenuLabel() {
  const mi = $('miDir');
  if (!mi) return;
  if (IMP_HAS_DIR) {
    mi.innerHTML = '<span class="mi">📂</span>添加文件夹 / 批量文件';
    mi.title = '选择整个文件夹，递归导入其中的 .gba 与 .zip';
  } else {
    mi.innerHTML = '<span class="mi">📁</span>多选游戏 / 压缩包导入';
    mi.title = '当前浏览器不支持选择文件夹，请一次多选 .gba / .zip';
  }
}
impSyncDirMenuLabel();

/* FAB 与菜单接线 */
